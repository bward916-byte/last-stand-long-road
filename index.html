<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LAST STAND: THE LONG ROAD</title>
<style>
  html,body{margin:0;padding:0;background:#07080c;height:100%;overflow:hidden;touch-action:none;
    font-family:'Courier New',monospace;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#07080c}
  /* analog thumbstick (left) */
  #stick{position:fixed;left:16px;bottom:18px;width:132px;height:132px;border-radius:50%;

  #stick i.e{right:6px;top:calc(50% - 5px);border-left-color:#8f9}
  #nub{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;
    border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(180,255,200,.42),rgba(90,190,120,.26));
    border:2px solid rgba(170,255,190,.6);box-shadow:0 0 14px rgba(120,255,150,.22);
    pointer-events:none;will-change:transform}
  /* face buttons (right), laid out like a pad */
  #actBtns{position:fixed;right:14px;bottom:16px;width:142px;height:184px;z-index:5}
  .abtn{position:absolute;border-radius:50%;font-weight:bold;text-align:center;line-height:1.15;
    display:flex;align-items:center;justify-content:center;

  #btnAct{right:2px;bottom:22px;width:80px;height:80px;font-size:13px;
    background:rgba(255,90,60,.16);border:2px solid rgba(255,140,90,.5);color:#fca}
  #btnB{right:78px;bottom:64px;width:60px;height:60px;font-size:10px;

  #btnC{right:6px;bottom:112px;width:58px;height:58px;font-size:10px;

  .abtn:active,.abtn.on{filter:brightness(1.9)}

     movement D-pad never sits on top of the item list */
  #menuPad{position:fixed;left:0;right:0;bottom:0;height:74px;box-sizing:border-box;
    display:none;align-items:center;justify-content:center;gap:10px;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top,rgba(7,8,12,.98),rgba(9,11,17,.92));

  #mbOk{background:rgba(255,90,60,.14);border-color:rgba(255,140,90,.5);color:#fca;font-size:14px}
  #mbOk:active,#mbOk.on{background:rgba(255,120,80,.35)}
  body.uimenu #stick,body.uimenu #actBtns{display:none}
  body.uimenu #menuPad{display:none}
  #touchUI{display:none}
  @media (pointer:coarse){#touchUI{display:block}}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="touchUI">
  <div id="stick"><i class="n"></i><i class="s"></i><i class="w"></i><i class="e"></i>
    <div id="nub"></div></div>
  <div id="actBtns">
    <div class="abtn" id="btnC">TURBO</div>
    <div class="abtn" id="btnB">DEPLOY</div>
    <div class="abtn" id="btnAct">SWAP<br>OK</div>
  </div>
  <div id="menuPad">
    <div class="mbtn" id="mbUp">&#9650;</div>
    <div class="mbtn" id="mbDn">&#9660;</div>
    <div class="mbtn" id="mbOk">SELECT</div>
  </div>
</div>
<script>
"use strict";
/* == LAST STAND: THE LONG ROAD — endless journey, 10 biomes, road events == */
const W=360,H=220,BZ=1.3;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
const wrapEl=document.getElementById('wrap');
const MENUBAR_H=74;let uiReserve=0,uiMode='';
function fit(){const s=Math.min(innerWidth/W,Math.max(80,innerHeight-uiReserve)/H);
  cv.style.width=(W*s|0)+'px';cv.style.height=(H*s|0)+'px';}
/* swaps the touch controls between "play" (D-pad) and "menu" (docked bar)
   and shrinks the play area so the bar can never cover the list */
function syncTouchUI(){
  const m=(state==='shop'||state==='travel'||state==='skills'||state==='loadout'
    ||state==='camp'||state==='menu'||state==='over'||state==='pause'||state==='ending')?'menu':'play';
  if(m===uiMode)return;uiMode=m;
  document.body.classList.toggle('uimenu',m==='menu');
  const coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
  uiReserve=(m==='menu'&&coarse)?MENUBAR_H:0;
  wrapEl.style.bottom=uiReserve+'px';
  fit();}
addEventListener('resize',fit);fit();
const lc=document.createElement('canvas');lc.width=W;lc.height=H;const lx=lc.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------------- sfx ---------------- */
/* Layered synthesis: a tonal body plus filtered white noise, run through a
   shared compressor. Gunfire gets its crack from the noise, not the oscillator. */
let AC=null,muted=false,MASTER=null,NOISE=null,drone=null;
function ac(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();
    comp.threshold.value=-18;comp.knee.value=22;comp.ratio.value=8;
    comp.attack.value=0.003;comp.release.value=0.18;
    MASTER=AC.createGain();MASTER.gain.value=0.9;
    MASTER.connect(comp);comp.connect(AC.destination);
    const len=AC.sampleRate*1.2;
    NOISE=AC.createBuffer(1,len,AC.sampleRate);
    const d=NOISE.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  }
  if(AC.state==='suspended')AC.resume();
  return AC;}
function tone(f0,f1,dur,type,vol,delay){
  const a=AC,t=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+dur+0.02);}
function burst(dur,vol,ftype,f0,f1,q,delay){
  const a=AC,t=a.currentTime+(delay||0);
  const src=a.createBufferSource();src.buffer=NOISE;
  src.loop=true;src.playbackRate.value=0.8+Math.random()*0.5;
  const flt=a.createBiquadFilter();flt.type=ftype;
  flt.frequency.setValueAtTime(f0,t);
  flt.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
  flt.Q.value=q||1;
  const g=a.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.003);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(flt);flt.connect(g);g.connect(MASTER);
  src.start(t);src.stop(t+dur+0.02);}
function sfx(t){
  if(muted)return;
  try{
    ac();
    switch(t){
      case 'shot':                                  /* light, snappy */
        burst(0.07,0.16,'highpass',1800,700,1);
        tone(300,90,0.05,'square',0.05);break;
      case 'shot2':                                 /* heavy, chesty */
        burst(0.13,0.24,'bandpass',1400,320,0.9);
        tone(150,45,0.11,'sawtooth',0.09);
        tone(70,30,0.16,'sine',0.07);break;
      case 'headshot':
        burst(0.05,0.13,'highpass',3200,1600,2);
        tone(1400,2300,0.06,'square',0.05);
        tone(900,1600,0.09,'triangle',0.04,0.03);break;
      case 'hit':
        burst(0.06,0.09,'lowpass',900,260,1);
        tone(170,60,0.06,'square',0.04);break;
      case 'boom':
        burst(0.55,0.34,'lowpass',900,60,0.7);
        tone(110,22,0.5,'sawtooth',0.14);
        tone(48,18,0.75,'sine',0.12);break;
      case 'dead': {                                /* three variants so a horde isn't monotone */
        const v=Math.random();
        burst(0.20+v*0.10,0.10,'bandpass',520+v*380,150+v*90,1.4);
        tone(230+v*120,36+v*20,0.36+v*0.16,'sawtooth',0.085);break;}
      case 'deadBig':                               /* brutes, giants, bosses */
        burst(0.6,0.20,'lowpass',480,70,0.8);
        tone(120,28,0.62,'sawtooth',0.13);
        tone(58,20,0.85,'sine',0.10);break;
      case 'deadWet':                               /* spitters, bloaters */
        burst(0.34,0.16,'lowpass',700,120,2.2);
        tone(180,42,0.30,'triangle',0.07);break;
      case 'crit':
        burst(0.10,0.22,'highpass',2400,600,1.6);
        tone(160,40,0.24,'sawtooth',0.13);
        tone(60,24,0.34,'sine',0.10);break;
      case 'yelp':                                  /* dogs */
        tone(900,1500,0.07,'sawtooth',0.075);
        tone(1300,340,0.20,'square',0.055,0.06);break;
      case 'hurt':
        burst(0.16,0.14,'lowpass',1400,300,1);
        tone(120,50,0.16,'sawtooth',0.09);break;
      case 'cash':
        tone(980,1480,0.08,'triangle',0.06);
        tone(1460,1960,0.09,'triangle',0.045,0.05);break;
      case 'combo':
        tone(700,1400,0.09,'square',0.05);
        tone(1050,2100,0.10,'triangle',0.04,0.05);break;
      case 'lvl':
        tone(440,660,0.16,'triangle',0.09);
        tone(660,990,0.22,'triangle',0.08,0.14);break;
      case 'buy':  tone(680,1020,0.10,'square',0.06);break;
      case 'deny': tone(210,120,0.13,'square',0.06);break;
      case 'climb':burst(0.05,0.05,'bandpass',2200,1400,3);break;
      case 'clank':
        burst(0.09,0.13,'bandpass',3000,2000,6);
        tone(1700,900,0.07,'square',0.04);break;
      case 'whoosh':
        burst(0.32,0.10,'bandpass',380,1500,1.6);break;
      case 'scream':
        tone(1250,320,0.42,'sawtooth',0.08);
        tone(1870,480,0.38,'square',0.035,0.02);break;
      case 'sizz':
        burst(0.26,0.09,'highpass',2600,900,0.8);break;
      case 'step':
        burst(0.045,0.035,'lowpass',520,180,1);break;
    }
  }catch(e){}
}
/* ---- procedural score: a minor-pentatonic pulse that follows the fight ----
   Intensity tracks how many of them are close. Calm is a sparse bass heartbeat
   over the drone; a crowd brings in the kick, hats and a high arpeggio. */
const MSCALE=[0,3,5,7,10];
let mus={next:0,step:0,int:0};
function musicTick(){
  if(muted||!AC||state!=='play'||!P||!lvl)return;
  let near=0;
  for(const z of zombies)if(Math.abs(z.x-P.x)<140&&z.f===P.f)near++;
  const dread=zombies.some(z=>z.t==='pilgrim'&&!z.fleeing);
  let tgt=clamp(near/5,0,1)*(lvl.bloodMoon?1:0.92)+(lvl.bloodMoon?0.08:0);
  if(dread)tgt=Math.max(tgt,0.82);
  mus.int+=(tgt-mus.int)*0.04;
  const t=AC.currentTime;
  if(mus.next<t-0.5)mus.next=t;             /* resync after a pause */
  const bpm=90+mus.int*46,spb=60/bpm/2;     /* eighth notes */
  const root=49*Math.pow(2,(biomeIdx(SV.level)%10)/12)*(lvl.bloodMoon?0.5:1);
  while(mus.next<t+0.14){
    const st=mus.step%8,d=mus.next-t,I=mus.int;
    if(st===0||st===4||(I>0.5&&st===6))
      tone(root,root*0.99,spb*0.92,'triangle',0.045+0.05*I,d);
    if(I>0.22&&(st===0||st===4))
      tone(130,38,0.10,'sine',0.11*I,d);
    if(I>0.40&&st%2===1)
      burst(0.03,0.030*I,'highpass',6400,5200,1,d);
    if(I>0.34&&st===4)
      burst(0.09,0.05*I,'bandpass',1700,900,2,d);
    if(I>0.62&&(st===2||st===5||st===7))
      tone(root*4*Math.pow(2,MSCALE[(mus.step*3)%5]/12),root*4,spb*0.8,'square',0.026,d);
    if(dread&&st===0)
      tone(root*Math.pow(2,6/12),root*Math.pow(2,6/12),spb*3.6,'sawtooth',0.022,d);
    mus.next+=spb;mus.step++;}}
/* low ambient bed, retuned per biome */
function setDrone(hz){
  if(muted||!hz){stopDrone();return;}
  try{
    ac();stopDrone();
    const o=AC.createOscillator(),o2=AC.createOscillator(),
      g=AC.createGain(),f=AC.createBiquadFilter();
    o.type='sawtooth';o.frequency.value=hz;
    o2.type='sine';o2.frequency.value=hz*0.5;
    f.type='lowpass';f.frequency.value=220;f.Q.value=2;
    g.gain.value=0.0001;
    o.connect(f);o2.connect(f);f.connect(g);g.connect(MASTER);
    g.gain.exponentialRampToValueAtTime(0.035,AC.currentTime+1.5);
    o.start();o2.start();
    drone={o,o2,g};
  }catch(e){}}
function stopDrone(){
  if(!drone)return;
  try{drone.g.gain.cancelScheduledValues(AC.currentTime);
    drone.g.gain.setValueAtTime(drone.g.gain.value,AC.currentTime);
    drone.g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.4);
    drone.o.stop(AC.currentTime+0.5);drone.o2.stop(AC.currentTime+0.5);}catch(e){}
  drone=null;}

/* ---------------- sprites (auto-outlined) ---------------- */
function norm(rows){const w=Math.max(...rows.map(r=>r.length));return rows.map(r=>r.padEnd(w,'.'));}
function mk(rowsIn,pal){
  const rows=norm(rowsIn),h=rows.length,w=rows[0].length;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=rows[j][i];
    if(ch==='.')continue;x.fillStyle=pal[ch]||'#f0f';x.fillRect(i,j,1,1);}
  return outline(c);}
function outline(spr){
  const c=document.createElement('canvas');c.width=spr.width+2;c.height=spr.height+2;
  const x=c.getContext('2d');
  for(const d of[[0,1],[2,1],[1,0],[1,2]])x.drawImage(spr,d[0],d[1]);
  x.globalCompositeOperation='source-in';x.fillStyle='#0a0c08';
  x.fillRect(0,0,c.width,c.height);
  x.globalCompositeOperation='source-over';x.drawImage(spr,1,1);return c;}
const SPAL={h:'#43533a',H:'#5c7048',f:'#e8b98c',F:'#c9986c',e:'#22262e',
  v:'#45543a',V:'#5a6c48',o:'#c96a2a',p:'#333f2c',P:'#28311f',b:'#242018',s:'#12160e',k:'#7a4a2a'};
function legs(i){return{
  0:["...pp..pp...","..pp....pp..","..bb....bb..",".sbb....bbs."],
  1:["...pppppp...","...pp..pp...","...bb..bb...","..sbb..bbs.."],
  2:["....pppp....","...pp.pp....","...bb..bb...","...sb..bs..."]}[i];}
function solRows(i){return["....hhhh....","...hHHHHh...","...hHHHHh...","...ffffff...",
  "...feffef...","....fFFf....","...vvvvvv...","..vVVvvVVv..","..kovvvvok..",
  "..vvvvvvvv..","...PppppP...",...legs(i)];}
const SOL=[0,1,2].map(i=>mk(solRows(i),SPAL));
function zomRows(i){return["....gggg....","...gGGGGg...","...geGGeg...","...gGGGGg...",
  "....gmmg....","...cccccc...","..cCCccCCc..","gcCcccccCcgg","..cccccccc..",
  "...TttttT...","...tttttt...",...legs(i).map(r=>r.replace(/p/g,'t').replace(/b/g,'g').replace(/P/g,'T'))];}
const ZPALS={
 walker:{g:'#6fae5c',G:'#83c46e',e:'#e04040',m:'#3d1f1f',c:'#565b6c',C:'#6a7086',t:'#3b3f50',T:'#2e3242',s:'#161a10'},
 runner:{g:'#a9c25a',G:'#c0d873',e:'#ffd23a',m:'#3d2f1f',c:'#6e4b3a',C:'#835c48',t:'#503a2d',T:'#3f2d23',s:'#1c1812'},
 brute:{g:'#4c8a4c',G:'#5da05d',e:'#ff5a2a',m:'#2d1414',c:'#3f4a5e',C:'#4f5c73',t:'#2c3346',T:'#232838',s:'#0e120a'},
 spitter:{g:'#7fbf8f',G:'#95d6a6',e:'#7affc8',m:'#1f3d2a',c:'#4a6e5a',C:'#5b8570',t:'#31503d',T:'#274031',s:'#121e16'},
 hazmat:{g:'#d8c24a',G:'#f0dc6e',e:'#3a4a5c',m:'#6a5a1a',c:'#c8b23a',C:'#e0cc5e',t:'#8a7a24',T:'#6e6118',s:'#1a1608'},
 leaper:{g:'#8f6fae',G:'#a683c4',e:'#ffd23a',m:'#2d1f3d',c:'#4a3a5e',C:'#5c4a73',t:'#332846',T:'#281f38',s:'#140e1c'}};
/* three tinted variants per species so a horde doesn't look cloned */
function shade(hex,d){
  const n=parseInt(hex.slice(1),16);
  const r=clamp(Math.round(((n>>16)&255)*(1+d.r)),0,255),
        g=clamp(Math.round(((n>>8)&255)*(1+d.g)),0,255),
        b=clamp(Math.round((n&255)*(1+d.b)),0,255);
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}
function shiftPal(pal,d){const o={};for(const k in pal)o[k]=shade(pal[k],d);return o;}
const ZVAR=[{r:0,g:0,b:0},{r:.16,g:-.05,b:-.12},{r:-.12,g:.05,b:.16}];
const ZSPR={};
for(const k in ZPALS)
  ZSPR[k]=ZVAR.map(d=>[0,1,2].map(i=>mk(zomRows(i),shiftPal(ZPALS[k],d))));
const CRPAL={g:'#7fae5c',G:'#93c46e',e:'#e04040',c:'#4a4f5e',C:'#5c6274',t:'#3b3f50',s:'#141810'};
const CRAWL=[
 mk(["........gggg","......gGGeg.","...ccgGGGg.g","..ccccccc.gg",".tcCCCcccg..","ttcccccc....",".tt....s...."],CRPAL),
 mk(["........gggg","......gGGeg.","...ccgGGGggg","..ccccccc...",".tcCCCccc.g.","ttcccccc.gg.",".tt..s......"],CRPAL)];
const EXPAL={g:'#8fae6c',G:'#a3c47e',e:'#e0d040',m:'#3d2f1f',b:'#7a9a5f',B:'#a5c485',
  Y:'#e8e86a',t:'#3b4030',s:'#141810'};
function bigRows(i){return["....gggg....","...gGGGGg...","...geGGeg...","....gmmg....",
 "...bbbbbb...","..bBBBBBBb..",".bBBYBBYBBb.",".bBBBBBBBBb.",".bBBBBYBBBb.",
 ".bbBBBBBBbb.","..bbbbbbbb..","...tttttt...",
 i?"...tt..tt...":"..tt....tt..",i?"...gg..gg...":"..gg....gg..","..s......s.."];}
const EXPL=[0,1].map(i=>mk(bigRows(i),EXPAL));
/* bloater: swollen, gas-filled, pops into a toxic cloud */
const BLPAL={g:'#6a8f5a',G:'#7ea36c',e:'#c8ff6a',m:'#2a3d1a',b:'#5f7a4a',B:'#86a86a',
  Y:'#c0e05a',t:'#3a4630',s:'#12180c'};
const BLOAT=[0,1].map(i=>mk(bigRows(i),BLPAL));
/* wretch: winged, hovers, dives at your head */
const WRPAL={g:'#6a4a6e',G:'#84618a',w:'#3d2a44',e:'#ffe23a',s:'#150c18'};
const WRETCH=[
 mk(["w..........w","ww...gg...ww",".wwwgGGgwww.","..wwGGGGww..","...geGGeg...",
     "....gGGg....","....gggg....",".....gg.....","....g..g...."],WRPAL),
 mk(["............",".w...gg...w.",".www.GG.www.","..wwgGGgww..",".wwgeGGegww.",
     "ww..gGGg..ww","....gggg....",".....gg.....","....g..g...."],WRPAL)];
/* hound: low, fast, hunts in packs */

/* ---- saved run (GitHub Pages has real localStorage) ---- */
const SKEY='lastStandLongRoad.save.v2';
let savedRun=null;
function saveRun(){
  try{localStorage.setItem(SKEY,JSON.stringify(SV));savedRun=JSON.parse(JSON.stringify(SV));}
  catch(e){}}
function clearRun(){try{localStorage.removeItem(SKEY);}catch(e){}savedRun=null;}
function loadRun(){
  try{
    const raw=localStorage.getItem(SKEY);if(!raw)return null;
    const o=JSON.parse(raw),base=freshSave();
    if(!o||typeof o.level!=='number')return null;
    /* merge so saves from older builds still open */
    const m=Object.assign(base,o);
    m.owned=Object.assign({},base.owned,o.owned||{});
    m.items=Object.assign({},base.items,o.items||{});
    m.skills=Object.assign({},base.skills,o.skills||{});
    m.gear=Object.assign({},base.gear,o.gear||{});
    m.ammo=Object.assign({},o.ammo||{});
    m.sup=Object.assign({},base.sup,o.sup||{});
    m.storyAt=o.storyAt||0;
    m.pilgrimMet=o.pilgrimMet||0;m.pilgrimDead=o.pilgrimDead||0;
    m.kills=o.kills||0;m.ng=o.ng||0;
    m.sp=o.sp||0;
    m.up=Object.assign({},base.up);
    for(const k in base.up)m.up[k]=Object.assign({},base.up[k],(o.up||{})[k]||{});
    m.mod={zmult:1};
    if(!WEAPONS[m.cur]||!m.owned[m.cur])m.cur='pistol';
    return m;
  }catch(e){return null;}}
savedRun=loadRun();

/* --- how strong is the player, roughly, vs what a tier expects --- */
function playerPower(){
  let p=(SV.maxHp-100)*0.9;
  for(const k of WKEYS)if(SV.owned[k])p+=Math.sqrt(WEAPONS[k].cost||60)*3.2;
  for(const k in SV.up)p+=(SV.up[k].d+SV.up[k].r)*11;
  for(const k of IKEYS)p+=SV.items[k]*ITEMS[k].cost*0.05;
  for(const k of GKEYS)for(let r=0;r<gr(k);r++)p+=Math.sqrt(GEAR[k].cost[r])*1.6;
  return Math.round(p);}
function tierPower(t){return Math.round(30*Math.pow(t,0.85));}
function readiness(t){
  const r=playerPower()/Math.max(1,tierPower(t));
  if(r>=1.00)return{label:'READY',col:'#7dffc8',n:2};
  if(r>=0.65)return{label:'RISKY',col:'#ffd76a',n:1};
  return{label:'NOT READY',col:'#ff6a5a',n:0};}

  out.push({tier:mid,kind:'mid',mult:1.0, label:'THE MAIN ROAD',
    note:'Straight on to '+(isDrive(mid)?'a highway run':biomeFor(mid).name)+'.'});

    return[out[0],{tier:30,kind:'final',mult:1.5,label:'THE LIGHTHOUSE',

  out.push({tier:hi,kind:'high',mult:1.7,label:'THE DEEP ROUTE',fuel:2,

function travelItems(){
  const it=[];
  if(event&&!eventDone)for(let i=0;i<event.opts.length;i++)it.push({type:'evt',i,label:event.opts[i].label});
  it.push({type:'hdr',label:'GET READY'});

  it.push({type:'camp',label:'WORKBENCH \u00b7 '+SV.sup.scrap+' SCRAP'});

  const rs=routeOptions();
  for(let i=0;i<rs.length;i++){

      locked,
      label:r.label+'  \u00b7  TIER '+r.tier+'  \u00b7  '
        +(locked?'NEEDS '+r.fuel+' FUEL':rd.label+(r.fuel?'  \u00b7  \u26fd'+r.fuel:''))});}

function travelPress(k){
  const items=travelItems();
  const move=d=>{do{travelSel=(travelSel+d+items.length)%items.length;}
    while(items[travelSel].type==='hdr');sfx('climb');};
  if(items[travelSel]&&items[travelSel].type==='hdr')travelSel=1;
  if(k==='arrowup'||k==='w'||k==='up'){move(-1);}
  else if(k==='arrowdown'||k==='s'||k==='down'){move(1);}
  else if(k==='act'||k==='enter'||k===' '||k==='tap'){
    const it=items[travelSel];
    if(it.type==='go'){
      const r=routeOptions()[it.route];
      if(it.locked){sfx('deny');return;}
      if(r.fuel)SV.sup.fuel-=r.fuel;
      finalRun=r.kind==='final';
      routeMult=r.mult;routeKind=r.kind;lastGain=0;
      SV.pending=r.tier;
      startLevel(r.tier);return;}
    if(it.type==='hdr')return;
    if(it.type==='shop'){state='shop';shopSel=0;sfx('buy');return;}
    if(it.type==='loadout'){state='loadout';loadSel=0;sfx('buy');return;}
    if(it.type==='skill'){state='skills';skillSel=0;sfx('buy');return;}
    if(it.type==='camp'){state='camp';campSel=0;sfx('buy');return;}
    if(it.type==='evt'){const o=event.opts[it.i];
      if(o.deny&&o.deny()){sfx('deny');}
      eventResult=o.fx();eventDone=true;travelSel=0;sfx('buy');}}
}

const stickEl=document.getElementById('stick'),nubEl=document.getElementById('nub');
let stickId=null;
const STICK_R=46,STICK_DZ=13;
function stickAim(dx,dy){
  const m=Math.hypot(dx,dy);
  if(m>STICK_R){dx=dx/m*STICK_R;dy=dy/m*STICK_R;}
  nubEl.style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px)';

function pollGamepad(){
  if(!navigator.getGamepads)return;
  let gp=null;
  const list=navigator.getGamepads();
  for(let i=0;i<list.length;i++)if(list[i]&&list[i].connected){gp=list[i];break;}
  if(!gp)return;
  if(!gpSeen){gpSeen=true;itemMsg='CONTROLLER CONNECTED';itemMsgT=2.2;}
  const ax=gp.axes[0]||0,ay=gp.axes[1]||0,dz=0.35;
  const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
  const dir={left:ax<-dz||b(14),right:ax>dz||b(15),up:ay<-dz||b(12),down:ay>dz||b(13)};
  if(state==='play'){
    /* only clear the keys the pad itself set, so a keyboard still works */
    for(const k in gpHeld)if(gpHeld[k]&&!dir[k])keys[k]=false;
    for(const k in dir)if(dir[k])keys[k]=true;
    gpHeld=dir;
  }else{
    for(const k in gpHeld)if(gpHeld[k])keys[k]=false;
    gpHeld={};
    gpNav-=1/60;
    if(dir.up||dir.down){
      if(gpNav<=0){handlePress(dir.up?'up':'down');gpNav=gpBtn.nav?0.14:0.34;gpBtn.nav=1;}
    }else gpBtn.nav=0;
  }
  /* edge-triggered buttons: A confirm, B deploy, X/Y/LB/RB = specials 1-4 */
  const press=(i,fn)=>{const now=b(i);if(now&&!gpBtn[i])fn();gpBtn[i]=now;};
  press(0,()=>handlePress(
    (state==='play'&&relief&&lvl.floors===1&&!P.drive)?'jump':'act'));
  press(9,()=>handlePress(state==='play'?'escape':'act'));
  press(1,()=>handlePress('e'));
  press(7,()=>handlePress('turbo'));
  press(10,()=>handlePress('turbo'));
  press(2,()=>handlePress('1'));
  press(3,()=>handlePress('2'));
  press(4,()=>handlePress('3'));
  press(5,()=>handlePress('4'));
}

function camUpdate(dt){
  let tx=P.x,ty=P.y-14,tz=BZ;
  if(cine.mode==='intro'){cine.t+=dt;
    if(cine.t<1.6){tx=lvl.width/2;ty=worldH/2;tz=fitZ();}
    else if(cine.t>2.9){cine.mode=null;toast('CLEAR ALL ZOMBIES',2);}
  }else if(cine.mode==='reveal'){cine.t+=dt;
    tx=extract.x;ty=gnd(extract.x,extract.f)-14;tz=Math.max(fitZ()*1.05,0.62);
    if(cine.t>2.1){cine.mode=null;cine.timer=Math.max(cine.timer,4);}
  }else if(cine.mode==='pulse'){cine.t+=dt;tz=Math.max(fitZ()*1.1,0.6);
    if(cine.t>2.3)cine.mode=null;
  }else{cine.timer-=dt;
    if(cine.timer<=0){cine.mode='pulse';cine.t=0;cine.timer=18+Math.random()*10;sfx('whoosh');}}
  const hw=W/(2*cam.z),hh=H/(2*cam.z);
  if(lvl.width>hw*2)tx=clamp(tx,hw,lvl.width-hw);else tx=lvl.width/2;
  if(worldH>hh*2)ty=clamp(ty,hh,worldH-hh);else ty=worldH/2;
  if(lvl.biome.out)ty=(P.f===1&&lvl.cellars&&lvl.cellars.length)
    ?groundY(1)-0.34*H/cam.z
    :gnd(P.x,0)-0.20*H/cam.z; /* sky up top, soil at the bottom edge */
  if(finisher){tx=finisher.x;ty=finisher.y;tz=Math.min(1.7,BZ*1.5);
    const hw2=W/(2*tz),hh2=H/(2*tz);
    if(lvl.width>hw2*2)tx=clamp(tx,hw2,lvl.width-hw2);
    if(worldH>hh2*2)ty=clamp(ty,hh2,worldH-hh2);}
  const fs3=finisher?8:4;
  const ps=Math.min(1,dt*fs3),zs=Math.min(1,dt*(finisher?6:3));
  cam.x+=(tx-cam.x)*ps;cam.y+=(ty-cam.y)*ps;cam.z+=(tz-cam.z)*zs;
}
function scrX(wx){return (wx-cam.x)*cam.z+W/2;}
function scrY(wy){return (wy-cam.y)*cam.z+H/2;}

     parts.push({x:ax,y:gnd(ax,f)-2,vx:(Math.random()-0.5)*8,vy:-14-Math.random()*10,

function update(dt){
  if(msgT>0)msgT-=dt;
  if(itemMsgT>0)itemMsgT-=dt;
  levelT+=dt;
  camUpdate(dt);ambient(dt);
  ltTimer-=dt;if(ltTimer<=0){lightning=0.3;
    ltTimer=lvl.biome.weather==='storm'?2.5+Math.random()*4:9+Math.random()*10;
    /* during real storms, some bolts come all the way down */
    if(lvl.biome.weather==='storm'&&Math.random()<0.45&&state==='play'){
      const bx=clamp(P.x+(Math.random()-0.5)*220,20,lvl.width-20);
      bolts.push({x:bx,t:0.28,seed:Math.random()*99});

        if(z.f===0&&Math.abs(z.x-bx)<16&&z.hp>0){z.hp-=70;z.flash=.15;
          if(z.hp<=0)killZombie(z);}

      if(Math.random()<0.3)fires.push({x:bx,f:0,t:3,r:13});}}
  if(lightning>0)lightning-=dt;
  if(P.muzzleT>0)P.muzzleT-=dt;
  if(shake>0)shake=Math.max(0,shake-dt*8);
  punchX=clamp(punchX-punchX*Math.min(1,dt*14),-5,5);
  punchY=clamp(punchY-punchY*Math.min(1,dt*14),-5,5);
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
  for(let i=lensBlood.length-1;i>=0;i--){
    lensBlood[i].t-=dt;if(lensBlood[i].t<=0)lensBlood.splice(i,1);}
  if(flashT>0)flashT-=dt;
  for(let i=rings.length-1;i>=0;i--){rings[i].r+=90*dt;rings[i].t-=dt;if(rings[i].t<=0)rings.splice(i,1);}
  for(let i=lights.length-1;i>=0;i--){lights[i].t-=dt;if(lights[i].t<=0)lights.splice(i,1);}
  const frozen=cine.mode==='intro';

  /* --- player --- */
  const spd=(P.drive?126:(turboT>0?142:52))*(1+0.06*gr('boots'));
  if(!frozen){
    if(P.rclimb){
      const tgt=P.rclimb.y;
      P.y+=(P.rclimb.down?46:-46)*dt;P.anim+=dt*7;
      if((P.rclimb.down&&P.y>=tgt)||(!P.rclimb.down&&P.y<=tgt)){
        P.y=tgt;
        if(!P.rclimb.down)P.roof=1;
        P.rclimb=null;sfx('climb');}
    }else if(P.climb){
      P.y+=P.climb.dirn*46*dt;P.anim+=dt*8;
      const cty=P.climb.tf===0?gnd(P.x,0):groundY(P.climb.tf);
      if((P.climb.dirn>0&&P.y>=cty)||(P.climb.dirn<0&&P.y<=cty)){
        P.y=cty;P.f=P.climb.tf;P.climb=null;sfx('climb');}
    }else{
      P.vx=0;
      if(keys['arrowleft']||keys['a']||keys['left']){P.vx=-spd;P.dir=-1;}
      if(keys['arrowright']||keys['d']||keys['right']){P.vx=spd;P.dir=1;}
      let nx=clamp(P.x+P.vx*dt,8,lvl.width-8);
      if(P.f===0&&!P.roof)nx=clampWalls(nx,P.x);
      else if(lvl.cellars&&lvl.cellars.length&&P.f===1)nx=tunnelClamp(nx);
      /* walking off the roof edge is allowed; gravity handles the rest */
      if(P.roof){
        const rf2=roofs[0];
        if(nx<rf2.a-3||nx>rf2.b+3){P.roof=0;P.air=true;P.vy=Math.max(P.vy,10);}}
      if(relief&&P.f===0&&!P.roof&&!P.air&&P.vx!==0){
        /* walk up anything gentle; a face taller than STEP_MAX needs a jump */
        const rise=gnd(P.x,0)-gnd(nx,0);
        if(rise>STEP_MAX){P.vx=0;P.blockT=0.25;
          if(!P.taughtJump){P.taughtJump=1;itemToast('TOO STEEP \u2014 PRESS UP TO JUMP');}}
        else P.x=nx;
        if(gaps.length&&!P.taughtGap){
          for(const g2 of gaps)
            if(Math.abs(P.x-((g2.a+g2.b)/2))<46){P.taughtGap=1;
              itemToast('BLACK WATER \u2014 JUMP OR DIE');break;}}
        if(lvl.cellars&&lvl.cellars.length&&!P.taughtCellar){
          for(const c2 of lvl.cellars)
            if(c2.wall!==null&&Math.abs(P.x-c2.wall)<24&&P.f===0){P.taughtCellar=1;
              itemToast('BLOCKED \u2014 FIND THE HATCH AND GO UNDER');break;}}
      }else P.x=nx;
      if(P.vx!==0)P.anim+=dt*10;else P.anim=0.6;
      if(P.blockT>0)P.blockT-=dt;
      const up=keys['arrowup']||keys['w']||keys['up'],dn=keys['arrowdown']||keys['s']||keys['down'];
      /* --- vertical: jump and fall on single-floor ground --- */

        if(!P.air){
          P.y=g0;                                  /* auto hill scaling */
          let atEscape=false;
          for(const rf3 of roofs)for(const rx3 of [rf3.a,rf3.b])
            if(Math.abs(P.x-rx3)<8)atEscape=true;
          if((up||keys[' ']||keys['jump'])&&P.jumpT<=0&&!atEscape&&!P.rclimb&&!P.roof){
            P.vy=-JUMP_V;P.air=true;P.jumpT=0.28;sfx('climb');
            for(let q=0;q<5;q++)parts.push({x:P.x+(Math.random()-0.5)*7,y:g0,
              vx:(Math.random()-0.5)*40,vy:-Math.random()*20,life:.3,
              c:'rgba(180,175,160,0.6)',s:1});}
        }else{
          P.vy+=GRAV*dt;P.y+=P.vy*dt;
          let gLand=gnd(P.x,0);
          if(P.roof&&roofs.length&&P.x>=roofs[0].a-3&&P.x<=roofs[0].b+3)gLand=roofs[0].y;
          else if(P.roof)P.roof=0;
          if(P.vy>0&&P.y>=gLand){
            P.y=gLand;P.vy=0;P.air=false;
            shake=Math.max(shake,0.9);sfx('step');
            for(let q=0;q<5;q++)parts.push({x:P.x+(Math.random()-0.5)*9,y:P.y,
              vx:(Math.random()-0.5)*60,vy:-Math.random()*26,life:.32,
              c:'rgba(170,164,150,0.55)',s:1});}}
        if(P.jumpT>0)P.jumpT-=dt;
        /* walked off a ledge */
        if(!P.air&&!P.roof&&gnd(P.x,0)-P.y>3){P.air=true;P.vy=10;}
        if(!P.air&&P.roof&&roofs.length)P.y=roofs[0].y;
      }else if(relief&&P.f===0){P.y=P.roof&&roofs.length?roofs[0].y:gnd(P.x,0);}
      if(up&&roofs.length&&P.f===0&&!P.roof&&!P.air&&!P.climb){
        for(const rf2 of roofs)for(const rx2 of [rf2.a,rf2.b])
          if(Math.abs(P.x-rx2)<7){P.rclimb={y:rf2.y,x:rx2};P.x=rx2;break;}}
      if(dn&&P.roof&&!P.climb){
        const rf2=roofs[0];
        for(const rx2 of [rf2.a,rf2.b])
          if(Math.abs(P.x-rx2)<7){P.roof=0;P.rclimb={y:gnd(rx2,0),x:rx2,down:1};break;}}
      if(up||dn)for(const L of ladders){
        if(Math.abs(L.x-P.x)<7){
          if(dn&&L.f===P.f){P.climb={tf:P.f+1,dirn:1};P.x=L.x;break;}
          if(up&&L.f===P.f-1){P.climb={tf:P.f-1,dirn:-1};P.x=L.x;break;}}}
    }
  }
  if(P.hurtT>0)P.hurtT-=dt;
  if(sk('medic')&&P.hp>0&&P.hp<SV.maxHp){
    let near=false;
    for(const z of zombies)if(z.hp>0&&z.f===P.f&&Math.abs(z.x-P.x)<70){near=true;break;}
    if(!near)P.hp=Math.min(SV.maxHp,P.hp+0.7*sk('medic')*dt);}
  /* --- turbo: charge, then plough through the horde --- */
  if(!frozen){
    if(turboT>0){
      turboT=Math.max(0,turboT-dt);
      P.anim+=dt*22;
      for(let q=0;q<3;q++)parts.push({x:P.x-P.dir*(4+Math.random()*12),y:P.y-4-Math.random()*14,
        vx:-P.dir*(80+Math.random()*140),vy:(Math.random()-0.5)*30,life:.28,
        c:Math.random()<.5?'rgba(255,220,140,0.7)':'rgba(255,140,60,0.55)',s:1});
      lights.push({x:P.x,y:P.y-9,r:34,t:.05});
      for(const z of zombies.slice()){
        if(z.hp<=0||z.f!==P.f)continue;
        if(Math.abs(z.x-P.x)>11+5*z.scale)continue;
        z.hp-=260;z.flash=.15;
        z.x+=P.dir*10;z.dir=-P.dir;
        gore(z.x,zMid(z),z.f,P.dir,18);
        shake=Math.max(shake,4);hitStop=Math.max(hitStop,0.03);
        if(z.hp<=0)killZombie(z);}
    }else if(turbo<100){
      turbo=Math.min(100,turbo+dt*1.6*(1+0.30*sk('adren')));
      if(turbo>=100&&!turboRung){turboRung=1;sfx('combo');itemToast('TURBO READY \u2014 SHIFT');}
    }
    if(turbo<100)turboRung=0;
  }
  /* --- truck: run them down --- */
  if(P.drive&&!frozen){
    P.ramT-=dt;
    if(Math.abs(P.vx)>20&&Math.random()<0.5)
      parts.push({x:P.x-Math.sign(P.vx)*13,y:P.y-2,vx:-Math.sign(P.vx)*(20+Math.random()*30),
        vy:-Math.random()*18,life:.5,c:'rgba(150,150,160,0.35)',s:1});
    for(const z of zombies.slice()){
      if(z.hp<=0||z.f!==P.f)continue;
      if(Math.abs(z.x-P.x)>13+4*z.scale)continue;
      const sp=Math.abs(P.vx);
      if(sp>25){
        const fatal=z.hp<=48+sp*1.1;
        z.hp-=48+sp*1.1;z.flash=.12;shake=Math.max(shake,3);
        z.x+=Math.sign(P.vx)*7;sfx('hit');
        /* every body you take costs the truck: about six and it's finished */
        if(fatal&&P.ramT<=0){
          P.ramT=0.3;P.rams=(P.rams||0)+1;
          P.hp-=SV.maxHp*0.17;
          flashT=Math.max(flashT,0.10);
          for(let q=0;q<8;q++)parts.push({x:P.x+P.dir*9,y:P.y-8,
            vx:(Math.random()-0.5)*70,vy:-Math.random()*70,life:.5,
            c:Math.random()<.5?'rgba(120,120,130,0.7)':'#ff8a3a',s:2,g:1,fy:P.y});
          const frac=P.hp/SV.maxHp;
          if(frac<=0){
            P.hp=0;explode(P.x,P.y-10,P.f,54,0,240);
            shake=9;flashT=0.35;state='over';overSel=0;stopDrone();
            toast('THE TRUCK IS GONE',3,'Six bodies was five too many.');
          }else if(frac<0.28&&!P.warned2){P.warned2=1;
            itemToast('HULL CRITICAL \u2014 STOP RAMMING');sfx('deny');}
          else if(frac<0.55&&!P.warned1){P.warned1=1;
            itemToast('HULL DAMAGED');}}
        for(let q=0;q<7;q++)parts.push({x:z.x,y:zMid(z),vx:Math.sign(P.vx)*(40+Math.random()*90),
          vy:-Math.random()*90,life:.55,c:Math.random()<.5?'#8f2020':'#6fae5c',s:2,g:1,fy:z.y,splat:1});
        if(z.hp<=0){killZombie(z);continue;}}
      if(P.ramT<=0){P.ramT=0.45;
        const heavy=z.t==='brute'||z.t==='armored'||z.t==='boss'||z.t==='abom';
        hurtPlayer(heavy?Math.round(z.dmg*0.6):2);}
    }
  }
  /* hazards */
  P.hazT-=dt;
  if(!P.climb&&!frozen)for(const h of hazards){
    if(h.f!==P.f||Math.abs(h.x-P.x)>h.w)continue;
    const active=h.type==='slime'||Math.sin(frame*0.055+h.x)>0.35;
    if(active&&P.hazT<=0){P.hazT=0.6;P.hp-=h.dmg;sfx('sizz');shake=1.5;
      parts.push({x:P.x,y:P.y-9,vy:-20,life:.5,c:h.type==='slime'?'#7aff5a':'#e8e8f0',s:1,txt:'-'+h.dmg});
      if(P.hp<=0){P.hp=0;state='over';overSel=0;stopDrone();}}
  }

  /* --- targeting + auto-fire (works on ladders) --- */
  P.target=null;
  const wk=SV.cur,wp=WEAPONS[wk],by=P.y-9;
  if(!frozen){
    let bd=wp.range*1.08;
    for(const z of zombies){
      const dx=Math.abs(z.x-P.x);
      const vwin=z.fly?64:28;
      if(dx<bd&&Math.abs(zMid(z)-by)<vwin){bd=dx;P.target=z;}}
  }
  P.fireT-=dt;
  if(P.target&&P.fireT<=0&&SV.cur!=='pistol'&&ammoOf(SV.cur)<=0){
    /* dry — fall back to the sidearm */
    sfx('deny');itemToast(WEAPONS[SV.cur].name+' DRY \u2014 SIDEARM OUT');
    SV.cur='pistol';P.fireT=0.25;}
  if(P.target&&P.fireT<=0){
    const z=P.target;
    P.dir=z.x>P.x?1:-1;
    if(SV.cur!=='pistol'&&SV.ammo&&typeof SV.ammo[SV.cur]==='number')SV.ammo[SV.cur]--;
    /* muzzle pressed to the body: elevation can't save it */
    if(Math.abs(z.x-P.x)<14&&z.hp>0){
      P.fireT=1/wRof(wk);P.muzzleT=0.06;sfx(wp.snd);
      const dmg0=wDmg(wk)*wp.pellets;
      z.hp-=dmg0;z.flash=.1;
      gore(z.x,zMid(z),z.f,-P.dir,Math.min(4,1+dmg0/14));
      if(z.hp<=0)killZombie(z);
      shake=Math.min(shake+0.6,2.5);
      return;}
    P.fireT=1/wRof(wk);P.muzzleT=0.06;
    sfx(wp.snd);shake=Math.min(shake+0.6,2.5);
    const kick=Math.min(3.2,0.5+wp.dmg*0.06+(wp.pellets-1)*0.35);
    punchX=clamp(punchX-P.dir*kick,-5,5);punchY=clamp(punchY-kick*0.25,-5,5);
    const tt=Math.max(Math.abs(z.x-P.x)/wp.bspd,0.05);
    const aimVy=clamp((zMid(z)-by)/tt,z.fly?-170:-70,70);
    for(let i=0;i<wp.pellets;i++){
      bullets.push({x:P.x+P.dir*7,y:by+(Math.random()-0.5)*wp.spread*0.3,
        vx:P.dir*wp.bspd,vy:aimVy+(Math.random()-0.5)*wp.spread*6,dmg:wDmg(wk),
        life:wp.range/wp.bspd,pierce:wp.pierce,color:wp.color,trail:[],
        burn:wp.burn||0,boom:wp.boom||0});}
    parts.push({x:P.x-P.dir*2,y:by,vx:-P.dir*(20+Math.random()*20),vy:-50-Math.random()*30,
      life:1.1,c:'#d8b45a',s:1,g:1,fy:P.climb?P.y+30:P.y});
    parts.push({x:P.x+P.dir*(wp.blen+2),y:by-1,vx:P.dir*(8+Math.random()*14),
      vy:-8-Math.random()*10,life:.5+Math.random()*.3,
      c:'rgba(190,190,200,0.'+(3+(Math.random()*2|0))+')',s:2});
  }

  /* --- bullets --- */
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>4)b.trail.shift();
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    let dead=b.life<=0||b.x<2||b.x>lvl.width-2;
    for(const z of zombies){
      if(z.hp<=0)continue;
      const hw=6*z.scale;
      if(Math.abs(b.x-z.x)<hw&&b.y>zTop(z)-1&&b.y<z.y+3){
        let dmg=b.dmg;
        /* top slice of the sprite is the head */
        const head=z.spr!=='crawler'&&z.spr!=='hound'&&b.y<zTop(z)+5.5*z.scale;
        if(head&&z.t!=='armored'){
          dmg*=1.8+0.20*sk('eye');sfx('headshot');
          parts.push({x:b.x,y:b.y-8,vy:-26,life:.75,c:'#ffe066',s:1,txt:'HEAD!'});
          for(let q=0;q<5;q++)parts.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*90,
            vy:-Math.random()*80,life:.5,c:'#c02020',s:2,g:1,fy:z.y,splat:1});
          hitStop=Math.max(hitStop,0.03);}
        if(z.t==='armored'&&Math.sign(b.vx)===-z.dir){
          dmg*=0.3;sfx('clank');
          for(let p=0;p<3;p++)parts.push({x:b.x,y:b.y,vx:-Math.sign(b.vx)*(30+Math.random()*50),
            vy:-Math.random()*70,life:.3,c:'#ffe9a0',s:1});
        }else{
          for(let p=0;p<4;p++)parts.push({x:b.x,y:b.y,vx:Math.sign(b.vx)*(20+Math.random()*60),
            vy:-Math.random()*60,life:.45,c:'#8f2020',s:1,g:1,fy:z.y,splat:1});
        }
        if(b.burn&&z.t!=='hazmat'&&z.aff!=='burn')z.burn=1.4;
        z.hp-=dmg;z.flash=.08;sfx('hit');
        if(b.boom){explode(b.x,b.y,z.f,32,10,120);dmg+=0;b.pierce=0;}
        parts.push({x:b.x,y:b.y-4,vy:-22,life:.6,c:'#ffe08a',s:1,txt:''+Math.round(dmg)});

    if(!dead&&lvl.cellars)for(const c of lvl.cellars){
      if(Math.abs(b.x-c.wall)<4&&b.y>gnd(c.wall,0)-44&&b.y<gnd(c.wall,0)+2){
        dead=true;
        parts.push({x:b.x-Math.sign(b.vx)*2,y:b.y,vx:-Math.sign(b.vx)*40,
          vy:-20-Math.random()*20,life:.25,c:'#c8b090',s:1});

    if(!dead)for(const pr of props){

      /* don't let your own auto-fire cook a drum in your lap */

      if(Math.abs(b.x-pr.x)<7&&b.y>gnd(pr.x,pr.f)-15&&b.y<gnd(pr.x,pr.f)+2){
        pr.hp-=b.dmg;pr.shk=0.18;sfx('clank');
        for(let q=0;q<4;q++)parts.push({x:b.x,y:b.y,vx:-Math.sign(b.vx)*(20+Math.random()*50),
          vy:-Math.random()*60,life:.3,c:'#ffb35a',s:1});
        if(pr.hp<=0&&pr.fuse<0)pr.fuse=0.38+Math.random()*0.18;

    if(dead&&b.boom&&b.life>0){explode(b.x,b.y,P.f,32,10,120);}
    if(dead){
      if(b.life>0){
        for(let p=0;p<3;p++)parts.push({x:b.x,y:b.y,vx:-Math.sign(b.vx)*(20+Math.random()*40),
          vy:-Math.random()*50,life:.25,c:'#c8c8d0',s:1});
        if(decals.length<200)decals.push({x:b.x-1,y:b.y,w:2,c:'rgba(20,22,28,0.7)'});}
      bullets.splice(i,1);}
  }

  /* --- zombies --- */
  if(!frozen)for(const z of zombies.slice()){
    if(z.hp<=0)continue;
    if(z.flash>0)z.flash-=dt;
    if(z.aff==='swift'&&Math.random()<0.35)
      parts.push({x:z.x-z.dir*4,y:z.y-4-Math.random()*8,vx:-z.dir*(30+Math.random()*30),
        vy:(Math.random()-0.5)*10,life:.25,c:'rgba(255,224,102,0.55)',s:1});
    if(z.burn>0){z.burn-=dt;z.hp-=16*dt;
      if(Math.random()<0.5)parts.push({x:z.x+(Math.random()-0.5)*7,y:zMid(z),
        vy:-30-Math.random()*20,life:.35,c:'rgba(255,150,50,0.8)',s:1});
      if(z.hp<=0){killZombie(z);continue;}}
    if(z.dashT>0){z.dashT-=dt;
      z.x+=z.dir*z.sp*3.4*dt;z.anim+=dt*12;
      z.x=clamp(z.x,10,lvl.width-10);
      if(z.f===P.f&&Math.abs(z.x-P.x)<9*z.scale&&z.atkT<=0){
        z.atkT=0.8;hurtPlayer(z.dmg);z.dashT=0;}

    z.atkT-=dt;z.coolT-=dt;
    if(z.rageT>0)z.rageT-=dt;
    /* the longer a stop drags on, the harder they push — no more stalemates */
    const rage=(z.rageT>0?1.6:1)*(1+Math.min(0.4,levelT/150));
    const engaged=((z.f===P.f&&!P.climb&&!!z.roof===!!P.roof)||(P.climb&&Math.abs(P.y-z.y)<40))
      &&!(z.f===0&&P.f===0&&wallBetween(z.x,P.x));

    /* --- the wretch: hover, close in, dive --- */
    if(z.t==='pilgrim'){
      if(!z.fleeing&&SV.pilgrimMet<3&&z.hp<z.maxHp*0.35){
        z.fleeing=true;SV.cash+=140;sfx('whoosh');
        toast('IT WITHDRAWS',3,'Wounded, not finished. It will find you again.');}
      if(z.fleeing){
        const edge=z.x<lvl.width/2?-24:lvl.width+24;
        z.dir=edge>z.x?1:-1;z.x+=z.dir*95*dt;z.anim+=dt*11;
        if(Math.random()<0.4)parts.push({x:z.x,y:z.y-8-Math.random()*12,vx:0,vy:-16,
          life:.4,c:'rgba(40,30,50,0.6)',s:2});
        if(z.x<-18||z.x>lvl.width+18){z.dead=true;
          zombies.splice(zombies.indexOf(z),1);}
        continue;}
      if(relief&&z.f===0)z.y=gnd(z.x,0);
      z.hookT=(z.hookT===undefined?1.4:z.hookT)-dt;
      const gapP=Math.abs(z.x-P.x);
      if(z.hookT<=0&&z.f===P.f&&gapP>34&&gapP<170&&!P.climb){
        z.hookT=3.2+Math.random()*1.4;
        z.dir=P.x>z.x?1:-1;
        hooks.push({x:z.x+z.dir*6,y:z.y-12,vx:z.dir*230,from:z,life:0.9});
        sfx('whoosh');}
      /* keeps its distance: close if far, back off if crowded */
      if(gapP>68){z.dir=P.x>z.x?1:-1;z.x+=z.dir*z.sp*rage*dt;z.anim+=dt*6;}
      else if(gapP<42){z.dir=P.x>z.x?1:-1;z.x-=z.dir*24*dt;z.anim+=dt*4;}
      else{z.dir=P.x>z.x?1:-1;z.anim+=dt*2;}
      if(z.f===0)z.x=clampWalls(z.x,z.x);
      if(z.atkT>0)z.atkT-=dt;
      if(gapP<22*z.scale&&z.f===P.f&&z.atkT<=0&&!P.climb){
        z.atkT=1.2;hurtPlayer(Math.round(z.dmg*1.3));}
      z.x=clamp(z.x,10,lvl.width-10);
      continue;}
    if(z.fly){
      /* flyers ignore ladders: they cross floors on the wing */
      if(z.f!==P.f&&!z.swoop){
        const ty2=gnd(z.x,P.f)-z.alt;
        z.y+=(ty2-z.y)*Math.min(1,dt*2.2);z.anim+=dt*11;
        if(Math.abs(z.y-ty2)<8)z.f=P.f;
        z.x+=((P.x>z.x?1:-1))*z.sp*0.6*dt;
        z.x=clamp(z.x,10,lvl.width-10);
        continue;}
      const hover=gnd(z.x,z.f)-z.alt;
      z.anim+=dt*9;
      if(z.swoop>0){
        z.swoop-=dt;
        z.x+=z.dir*z.sp*2.6*rage*dt;
        z.y+=(P.y-6-z.y)*Math.min(1,dt*6);
        if(z.f===P.f&&Math.abs(z.x-P.x)<8*z.scale&&Math.abs(z.y-(P.y-6))<8&&z.atkT<=0){
          z.atkT=1.1;hurtPlayer(z.dmg);z.swoop=0;}
        if(z.swoop<=0)z.swoop=-1.4-Math.random()*1.2;   /* recover before the next pass */
      }else{
        if(z.swoop<0)z.swoop+=dt;
        const gap=Math.abs(P.x-z.x);
        /* standoff at ~50px: close enough to menace, far enough to be shot */
        z.dir=gap<48?(P.x>z.x?-1:1):(P.x>z.x?1:-1);
        z.x+=z.dir*z.sp*rage*dt;
        z.y+=(hover+Math.sin(frame*0.11+z.bob)*3-z.y)*Math.min(1,dt*4);
        if(z.swoop>=0&&z.f===P.f&&gap<110&&gap>30){
          z.swoop=0.6;z.dir=P.x>z.x?1:-1;sfx('whoosh');}
      }
      z.x=clamp(z.x,10,lvl.width-10);
      continue;}
    /* --- climbing between floors --- */
    if(z.climb){
      z.y+=z.climb.dirn*36*dt;z.anim+=dt*7;
      const zty=z.climb.tf===0?gnd(z.x,0):groundY(z.climb.tf);
      if((z.climb.dirn>0&&z.y>=zty)||(z.climb.dirn<0&&z.y<=zty)){
        z.y=zty;z.f=z.climb.tf;z.climb=null;}
      continue;}
    /* --- different floor: walk to the nearest ladder and come get you --- */
    const zBlocked=z.f===0&&P.f===0&&wallBetween(z.x,P.x);
    if(!engaged&&!z.guard&&(z.f!==P.f||zBlocked)&&(lvl.floors>1||(lvl.cellars&&lvl.cellars.length))){
      const ref=(lvl.cellars&&lvl.cellars.length&&z.f===1)?P.x:z.x;
      const want=(zBlocked||z.f<P.f)?z.f:z.f-1;
      let best=null,bd=1e9;
      for(const L of ladders)if(L.f===want){const d=Math.abs(L.x-ref)+Math.abs(L.x-z.x)*0.2;
        if(d<bd){bd=d;best=L;}}
      if(best){
        const dz=Math.abs(best.x-z.x);
        if(dz<5){z.x=best.x;
          z.climb={tf:(zBlocked||z.f<P.f)?z.f+1:z.f-1,dirn:(zBlocked||z.f<P.f)?1:-1};}
        else{z.dir=best.x>z.x?1:-1;z.x+=z.dir*z.sp*0.8*rage*dt;z.anim+=dt*5.5*rage;}
        z.x=clamp(z.x,10,lvl.width-10);continue;}
    }
    if(relief&&z.f===0&&!z.climb&&!z.roof)z.y=gnd(z.x,0);
    if(z.roof&&roofs.length){z.y=roofs[0].y;
      z.x=clamp(z.x,roofs[0].a+4,roofs[0].b-4);}
    /* lane guards hold their post: patrol unless the player is in with them */
    if(z.guard){
      const G2=lvl.gauntlet,
        inLane=z.guard==='tunnel'?P.f===1
          :z.guard==='roof'?!!P.roof
          :(P.f===0&&!P.roof&&P.x>G2.a-30&&P.x<G2.b+30);
      if(!inLane){
        if(!z.dir)z.dir=1;
        z.x+=z.dir*z.sp*0.35*dt;z.anim+=dt*3;
        const lo2=z.guard==='tunnel'?G2.a+10:(z.guard==='roof'?G2.a+6:G2.a+4),
          hi3=z.guard==='tunnel'?G2.b-10:(z.guard==='roof'?G2.b-6:G2.b-4);
        if(z.x<=lo2){z.x=lo2;z.dir=1;}
        if(z.x>=hi3){z.x=hi3;z.dir=-1;}
        if(z.atkT>0)z.atkT-=dt;
        continue;}}
    /* the big ones wind up a ground slam you can read and jump */
    const heavyZ=z.t==='brute'||z.t==='boss'||z.t==='abom'||z.t==='giant';
    if(heavyZ){
      if(z.slamCd>0)z.slamCd-=dt;
      if(z.windup>0){
        z.windup-=dt;z.anim=0;
        if(z.windup<=0){
          const R=30*z.scale,gy4=gnd(z.x,z.f);

          for(let q=0;q<14;q++){const a2=Math.random()*3.14;
            parts.push({x:z.x+Math.cos(a2)*(6+Math.random()*R*0.8),y:gy4-2,

              c:'rgba(150,140,120,0.8)',s:2,g:1,fy:gy4});}
          if(P.f===z.f&&!P.air&&!P.climb&&Math.abs(P.x-z.x)<R){

          z.slamCd=2.6+Math.random()*1.6;}
        continue;}
      if(engaged&&z.slamCd<=0&&z.f===P.f&&Math.abs(P.x-z.x)<26*z.scale&&z.atkT<=0){
        z.windup=0.8;sfx('clank');continue;}}
    if(engaged&&z.t==='leaper'){
      z.lungeT-=dt;
      const gap=Math.abs(P.x-z.x);
      if(z.lungeT<=0&&gap>26&&gap<120){
        z.dir=P.x>z.x?1:-1;z.dashT=0.42;z.lungeT=2.6+Math.random();
        sfx('whoosh');
        for(let q=0;q<5;q++)parts.push({x:z.x,y:zMid(z),vx:-z.dir*(20+Math.random()*40),
          vy:-Math.random()*40,life:.3,c:'#a683c4',s:1});
        continue;}}
    if(engaged){
      const d=P.x-z.x;
      if((z.t==='exploder'||z.t==='abom')&&Math.abs(d)<15*z.scale&&Math.abs(P.y-z.y)<20&&z.fuseT<0){

  /* --- spit / cash / corpses / particles --- */

  if(!frozen)for(const pr of props.slice()){

  if(!frozen)for(let i=ammoDrops.length-1;i>=0;i--){const a=ammoDrops[i];

      let best=null,bf=2;

  if(!frozen&&cage&&!cage.open){

  if(!frozen&&lvl.obj==='holdout'&&killsLeft>0&&!extract.open){

      if(inZone){holdT-=dt;
        if(Math.random()<0.3)parts.push({x:lvl.holdX+(Math.random()-0.5)*5,
          y:gnd(lvl.holdX,0)-30-Math.random()*8,vy:-16,life:.5,c:'rgba(255,90,90,0.8)',s:1});}
      holdWaveT-=dt;
      if(holdWaveT<=0&&wavePool.length){holdWaveT=11;releaseWave();}
      if(holdT<=0){
        if(lvl.final){
          state='ending';endSel=0;endT=0;stopDrone();saveRun();return;}
        killsLeft=0;sfx('lvl');
        toast('SIGNAL SENT',2.6,'They lose interest. The road is open.');}}}
  /* --- the pilgrim arrives --- */
  if(!frozen&&pilgrimT>0){
    pilgrimT-=dt;
    if(pilgrimT<=0){
      const side=P.x<lvl.width/2?lvl.width-30:30;
      spawnZombie('pilgrim',side,P.f);
      const pg=zombies[zombies.length-1];
      pg.noCount=1;pg.aff=null;
      pg.hp=pg.maxHp=Math.round(650*Math.pow(1.35,SV.pilgrimMet)*lvl.hpMult*0.6);
      pg.hookT=3;
      SV.pilgrimMet++;
      sfx('scream');shake=Math.max(shake,5);flashT=Math.max(flashT,0.1);
      toast('THE PILGRIM',3.8,
        SV.pilgrimMet>1?'It found you again. It looks worse than before.'
          :'It has been following the broadcast too.');}}
  if(!frozen)for(let i=hooks.length-1;i>=0;i--){const h2=hooks[i];
    h2.x+=h2.vx*dt;h2.life-=dt;
    if(h2.life<=0){hooks.splice(i,1);continue;}
    if(!P.climb&&P.f===h2.from.f&&Math.abs(h2.x-P.x)<7&&Math.abs((P.y-8)-h2.y)<14){
      hurtPlayer(10);
      const pull2=Math.sign(h2.from.x-P.x)*44;
      P.x=clamp(P.x+pull2,8,lvl.width-8);
      shake=Math.max(shake,4);sfx('crit');
      itemToast('HOOKED');
      hooks.splice(i,1);}}
  /* --- meteors --- */
  if(!frozen&&lvl.disaster==='meteor'&&disLeft>0){
    disT-=dt;
    if(disT<=0){disT=1.0+Math.random()*1.3;disLeft--;
      const mx=clamp(P.x+(Math.random()-0.5)*260,30,lvl.width-30);
      meteors.push({x:mx,t:1.0,f:0});sfx('whoosh');}}
  if(!frozen)for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];
    m.t-=dt;
    if(m.t<=0){
      explode(m.x,gnd(m.x,0)-4,0,30,26,120);
      if(Math.random()<0.4)fires.push({x:m.x,f:0,t:4,r:15});
      meteors.splice(i,1);}}
  /* --- the twister --- */
  if(!frozen&&twister){
    twister.x+=twister.vx*dt;
    twister.phase+=dt*3;
    if(!twister.warned&&twister.x>40&&twister.x<lvl.width-40){twister.warned=true;
      sfx('whoosh');shake=Math.max(shake,2);}
    const tx2=twister.x+Math.sin(twister.phase*0.7)*8;
    /* the pull */
    if(P.f===0&&!P.climb&&!P.drive){
      const dx2=tx2-P.x,ad=Math.abs(dx2);
      if(ad<95&&ad>14)P.x+=Math.sign(dx2)*38*dt;
      if(ad<=16&&P.hurtT<=0){hurtPlayer(9);
        if(P.hp>0){P.vy=-150;P.air=true;sfx('whoosh');}}}
    for(const z of zombies){
      if(z.f!==0||z.climb||z.fly)continue;
      const dz2=tx2-z.x,az=Math.abs(dz2);
      if(az<95&&az>10)z.x+=Math.sign(dz2)*46*dt;
      if(az<=14){z.hp-=50*dt;z.flash=0.08;
        if(Math.random()<0.25)parts.push({x:z.x,y:z.y-10-Math.random()*20,
          vx:(Math.random()-0.5)*80,vy:-60-Math.random()*60,life:.6,
          c:'#4a5f38',s:2,g:1,fy:gnd(z.x,0)});
        if(z.hp<=0)killZombie(z);}}
    if((twister.vx>0&&twister.x>lvl.width+40)||(twister.vx<0&&twister.x<-40))twister=null;}
  /* --- surges: the road answers loitering with more bodies --- */
  if(!frozen&&!lvl.drive&&killsLeft>0&&surges<2&&lvl.n>=6&&levelT>surgeNext){
    surges++;surgeNext+=50;
    const nS=4+Math.min(6,(SV.level/3)|0),pick=['walker','walker','runner','hound','crawler'];
    for(let i2=0;i2<nS;i2++)spawnSomewhere(pick[(Math.random()*pick.length)|0],200);
    killsLeft+=nS;
    sfx('scream');shake=Math.max(shake,3);
    toast('SURGE',2.6,nS+' more heard the gunfire.');}
  /* --- reinforcements --- */
  if(!frozen&&wavePool.length&&zombies.length<=3&&killsLeft>0)releaseWave();

  /* --- extraction --- */
  if(killsLeft<=0){
    if(!extract.open){extract.open=true;flashT=0.25;sfx('lvl');
      toast('EXTRACTION OPEN!',2.5);
      cine={mode:'reveal',t:0,timer:cine.timer};}
    if(P.f===extract.f&&Math.abs(P.x-extract.x)<10&&!P.climb){
      if(ally){const pay=150+SV.level*12;SV.cash+=pay;
        rescueMsg='The survivor you pulled out paid their way: +$'+pay+'.';}
      enterTravel();}
  }
}
function popBarrel(pr){

    parts.push({x:pr.x,y:gy-8,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life:.6,
      c:Math.random()<.5?'#93403c':'#5c2222',s:2,g:1,fy:gy});}}
function explode(x,y,f,r,pd,zd){
  sfx('boom');shake=6;flashT=0.15;hitStop=Math.max(hitStop,0.06);
  lights.push({x,y,r:r*2.2,t:.3});
  rings.push({x,y,r:6,t:.4});

      c:Math.random()<.4?'#ffb35a':(Math.random()<.5?'#e8e86a':'#5a5a5a'),s:2,g:1,fy:gnd(x,f)});}

  if(Math.hypot(P.x-x,(P.y-9)-y)<r)hurtPlayer(pd);
  for(const o of zombies.slice()){
    if(o.hp<=0)continue;
    if(Math.hypot(o.x-x,zMid(o)-y)<r){o.hp-=zd;o.flash=.1;
      if(o.hp<=0)killZombie(o);}}
  for(const pr of props.slice())
    if(pr.vol&&!pr.gone&&pr.f===f&&Math.abs(pr.x-x)<r&&pr.fuse<0)
      pr.fuse=0.10+Math.random()*0.22;
}
/* one place for all the wet stuff: spray, pooling, and screen splatter */
function gore(x,y,f,dirn,amount){
  const gy=gnd(x,f);
  for(let i=0;i<amount;i++){
    const spread=(Math.random()-0.5)*1.5;
    parts.push({x,y,
      vx:dirn*(60+Math.random()*230)+spread*70,
      vy:-Math.random()*150+30,
      life:.5+Math.random()*.7,
      c:Math.random()<.72?(Math.random()<.5?'#8f2020':'#6d1414'):'#6fae5c',
      s:Math.random()<.3?3:2,g:1,fy:gy,splat:1});}
  if(decals.length<400)
    decals.push({x:x-6-Math.random()*10,y:gy-1,w:10+Math.random()*18,
      c:'rgba(96,18,18,'+(0.35+Math.random()*0.3).toFixed(2)+')'});
  /* blood on the lens when it happens right in your face */
  const d=Math.hypot(P.x-x,P.y-y);
  if(d<34&&lensBlood.length<26){
    const n=1+(Math.random()*3|0);
    for(let i=0;i<n;i++)lensBlood.push({
      x:clamp(scrX(x)+(Math.random()-0.5)*70,4,W-4),
      y:clamp(scrY(y)+(Math.random()-0.5)*60,4,H-4),
      r:1.5+Math.random()*4.5,t:2.2+Math.random()*1.8,max:4});}}
function deathSfx(z){
  switch(z.t){
    case 'hound': return sfx('yelp');
    case 'brute': case 'boss': case 'abom': case 'giant': return sfx('deadBig');
    case 'spitter': case 'bloater': case 'hazmat': return sfx('deadWet');
    case 'screamer': return sfx('scream');
    default: return sfx('dead');}}
function killZombie(z){
  if(z.dead)return;z.dead=true;
  if(!z.noCount)killsLeft--;SV.kills=(SV.kills||0)+1;deathSfx(z);
  if(z.t==='pilgrim'){
    SV.pilgrimDead=1;
    SV.cash+=600;SV.sup.fuel+=3;SV.sup.meds+=2;
    toast('IT IS DONE',4,
      'Whatever it was, it wanted the lighthouse for itself. The road east is yours.');}
  /* the last body on the road gets a moment */
  if(killsLeft===0&&state==='play'){
    finisher={x:z.x,y:zMid(z),t:1.15};
    sfx('lvl');flashT=Math.max(flashT,0.10);}
  zombies.splice(zombies.indexOf(z),1);
  const heavy=z.t==='boss'||z.t==='abom'||z.t==='brute';
  hitStop=Math.max(hitStop,heavy?0.13:0.045);
  punchX=clamp(punchX-Math.sign(z.x-P.x)*(heavy?2.2:0.6),-5,5);
  /* chained kills pay better */
  combo++;comboT=2.6;
  if(turboT<=0)turbo=Math.min(100,turbo+(heavy?18:6)*(1+0.30*sk('adren')));
  if(combo>comboBest)comboBest=combo;
  if(combo===3||combo===6||combo===10||combo===16)sfx('combo');
  const mult=(1+Math.min(combo-1,20)*0.05)*(routeMult||1)*(1+0.14*sk('scav'))
    *(lvl.bloodMoon?2:1);
  /* the dead sometimes carry a box of shells */
  if(Math.random()<(heavy?0.6:0.14)){
    const hungry=WKEYS.filter(k=>SV.owned[k]&&AMMO_CAP[k]
      &&typeof (SV.ammo&&SV.ammo[k])==='number'&&SV.ammo[k]<AMMO_CAP[k]);
    if(hungry.length&&ammoDrops.length<14)
      ammoDrops.push({x:z.x+(Math.random()-0.5)*12,f:z.f,t:14});}
  const n=heavy?6:(1+(Math.random()*2|0));
  const pot=Math.ceil(z.cash*mult);
  for(let i=0;i<n;i++)cash.push({x:z.x+(Math.random()-0.5)*16,y:gnd(z.x,z.f),f:z.f,v:Math.ceil(pot/n)});
  if(z.aff==='burn'){fires.push({x:z.x,f:z.f,t:5,r:17});sfx('sizz');}
  else if(z.aff==='venom'){fires.push({x:z.x,f:z.f,t:6,r:19,gas:1});sfx('sizz');}
  if(z.t==='bloater'){
    fires.push({x:z.x,f:z.f,t:8,r:27,gas:1});sfx('sizz');
    for(let p=0;p<14;p++)parts.push({x:z.x,y:zMid(z),vx:(Math.random()-0.5)*90,
      vy:-Math.random()*70,life:.8,c:'rgba(150,200,90,0.75)',s:2});}
  if(z.t==='exploder'){explode(z.x,zMid(z),z.f,26,20,60);return;}
  if(z.t==='abom'){explode(z.x,zMid(z),z.f,42,34,120);flashT=0.25;return;}
  /* overkill tears them apart instead of leaving a body */
  const gib=z.hp<-Math.max(10,z.maxHp*0.35);
  gore(z.x,zMid(z),z.f,Math.sign(z.x-P.x)||1,gib?34:16);
  if(gib){
    shake=Math.max(shake,3.5);
    for(let p=0;p<10;p++)parts.push({x:z.x,y:zMid(z),vx:(Math.random()-0.5)*260,
      vy:-Math.random()*190,life:1.0,c:'#4a5f38',s:3,g:1,fy:gnd(z.x,z.f),splat:1});
    if(decals.length<400)decals.push({x:z.x-14,y:gnd(z.x,z.f)-1,w:28,c:'rgba(74,12,12,0.66)'});
    return;}
  if(z.fly)for(let q=0;q<6;q++)parts.push({x:z.x,y:z.y,vx:(Math.random()-0.5)*70,
    vy:-20-Math.random()*40,life:.6,c:'#3d2a44',s:2,g:1,fy:gnd(z.x,z.f)});
  corpses.push({x:z.x,f:z.f,spr:z.spr,vr:z.vr,dir:z.dir,scale:z.scale,t:7,cr:z.spr==='crawler'});
  if(z.t==='boss'){shake=6;sfx('boom');flashT=0.2;}
}
function hurtPlayer(d){
  if(d<=0||P.hurtT>0)return;
  if(turboT>0)return;   /* untouchable mid-smash */
  if(P.air&&P.vy<40)return;   /* mid-leap, they swing under you */
  /* now and then one of them really connects; a helmet blunts it */
  const critCh=0.07*(1-0.28*gr('helm'));
  if(!P.drive&&Math.random()<critCh){
    d*=2.4-0.3*gr('helm');
    sfx('crit');shake=Math.max(shake,5);flashT=Math.max(flashT,0.14);
    hitStop=Math.max(hitStop,0.07);
    itemToast('SAVAGE HIT');
    for(let q=0;q<8;q++)parts.push({x:P.x,y:P.y-8,vx:(Math.random()-0.5)*130,
      vy:-Math.random()*110,life:.6,c:'#c02020',s:2,g:1,fy:P.y,splat:1});}
  d*=Math.pow(0.91,sk('tough'))*Math.pow(0.92,gr('vest'));
  P.hp-=d;P.hurtT=0.5;shake=3;sfx('hurt');
  for(let p=0;p<5;p++)parts.push({x:P.x,y:P.y-9,vx:(Math.random()-0.5)*80,vy:-Math.random()*60,
    life:.5,c:'#c03030',s:1,g:1,fy:P.climb?P.y+30:P.y});
  if(P.hp<=0){P.hp=0;state='over';overSel=0;stopDrone();}
}

function shopItems(){const it=[];
  it.push({k:'med',label:'FIELD MEDKIT  +50 HP',cost:90,type:'med'});
  for(const k of WKEYS)
    if(SV.owned[k]&&AMMO_CAP[k]&&typeof (SV.ammo&&SV.ammo[k])==='number')
      it.push({k,type:'ammo',cost:AMMO_BUY[k][1],
        label:WEAPONS[k].name+' AMMO +'+AMMO_BUY[k][0]+'  ('+SV.ammo[k]+'/'+AMMO_CAP[k]+')'});
  for(const k of IKEYS)
    it.push({k,label:ITEMS[k].name+'  (have '+SV.items[k]+')',cost:ITEMS[k].cost,type:'item'});
  for(const k of WKEYS){
    if(!SV.owned[k])it.push({k,label:'BUY '+WEAPONS[k].name,cost:WEAPONS[k].cost,type:'buy'});
    else{it.push({k,label:WEAPONS[k].name+' DMG +25% (Lv'+SV.up[k].d+')',cost:upCost(k,'d'),type:'d'});
      it.push({k,label:WEAPONS[k].name+' RATE +14% (Lv'+SV.up[k].r+')',cost:upCost(k,'r'),type:'r'});}}
  it.push({k:'hp',label:'MAX HP +25 (Lv'+SV.hpLvl+')',cost:hpCost(),type:'hp'});
  it.push({k:'go',label:'<< BACK TO THE ROAD',cost:0,type:'go'});
  return it;}
function shopPress(k){
  const items=gridShopItems();
  if(shopSel>=items.length)shopSel=items.length-1;
  if(k==='escape'){state='travel';sfx('buy');saveRun();return;}
  if(k==='arrowleft'||k==='a'||k==='left'){shopSel=(shopSel-1+items.length)%items.length;sfx('climb');}
  else if(k==='arrowright'||k==='d'||k==='right'){shopSel=(shopSel+1)%items.length;sfx('climb');}
  else if(k==='arrowup'||k==='w'||k==='up'){shopSel=(shopSel-SHOP_COLS+items.length)%items.length;sfx('climb');}
  else if(k==='arrowdown'||k==='s'||k==='down'){shopSel=(shopSel+SHOP_COLS)%items.length;sfx('climb');}
  else if(k==='act'||k==='enter'||k===' '||k==='tap'){
    const it=items[shopSel];
    if(!it)return;
    if(it.type==='go'){state='travel';sfx('buy');saveRun();return;}
    if(SV.cash<it.cost){sfx('deny');return;}
    if(it.type==='med'&&SV.hp>=SV.maxHp){sfx('deny');return;}
    if(it.type==='item'&&SV.items[it.k]>=itemMax(it.k)){sfx('deny');return;}
    if(it.type==='ammo'&&SV.ammo[it.k]>=AMMO_CAP[it.k]){sfx('deny');return;}
    SV.cash-=it.cost;sfx('buy');
    if(it.type==='item')SV.items[it.k]++;
    else if(it.type==='ammo')ammoAdd(it.k,AMMO_BUY[it.k][0]);
    else if(it.type==='buy'){SV.owned[it.k]=true;SV.cur=it.k;
      if(AMMO_CAP[it.k])SV.ammo[it.k]=AMMO_CAP[it.k];}
    else if(it.type==='d')SV.up[it.k].d++;
    else if(it.type==='r')SV.up[it.k].r++;
    else if(it.type==='med')SV.hp=clamp(SV.hp+50,1,SV.maxHp);
    else if(it.type==='hp'){SV.hpLvl++;SV.maxHp+=25;}
    saveRun();}}

    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}

function lampOn(L){return !L.flick||Math.sin(frame*0.7+L.ph)>-0.7;}
/* soft directional shadow: skews away from the sun, long at dawn/dusk */
function castShadow(x,y,w,h2){
  const TD=todFor();
  if(!lvl.biome.out||lvl.bloodMoon){
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(x-w/2,y-1,w,2);return;}
  const len=Math.min(h2*TD.shLen,34),dir=TD.shDir;
  ctx.save();ctx.translate(x,y);
  ctx.transform(1,0,-dir*0.85,0.28,0,0);
  const g=ctx.createLinearGradient(0,0,0,-len);
  g.addColorStop(0,'rgba(0,0,0,'+TD.shA+')');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.ellipse(0,-len/2,w*0.55,len/2,0,0,7);ctx.fill();
  ctx.restore();
  ctx.fillStyle='rgba(0,0,0,'+(TD.shA*0.8)+')';
  ctx.beginPath();ctx.ellipse(x,y,w*0.55,1.6,0,0,7);ctx.fill();}
function drawLighting(){
  lx.setTransform(1,0,0,1,0,0);lx.globalCompositeOperation='source-over';
  lx.clearRect(0,0,W,H);
  const stormy=lvl.biome.win==='city'||lvl.biome.weather==='storm'||lvl.biome.weather==='rain';
  const dark=lightning>0&&stormy?0.18:lvl.biome.dark;
  lx.fillStyle='rgba(4,6,14,'+dark+')';lx.fillRect(0,0,W,H);
  lx.globalCompositeOperation='destination-out';
  function punch(wx,wy,r,a){
    const x=scrX(wx),y=scrY(wy),rr=r*cam.z;
    if(x<-rr||x>W+rr||y<-rr||y>H+rr)return;
    const g=lx.createRadialGradient(x,y,0,x,y,rr);
    g.addColorStop(0,'rgba(0,0,0,'+a+')');g.addColorStop(1,'rgba(0,0,0,0)');
    lx.fillStyle=g;lx.beginPath();lx.arc(x,y,rr,0,7);lx.fill();}
  punch(P.x,P.y-10,80,0.95);
  if(P.muzzleT>0)punch(P.x+P.dir*12,P.y-9,55,0.9);
  for(const L of lamps)if(lampOn(L))punch(L.x,L.f*FLOOR_H+16,46,0.75);
  for(const pr of props)if(pr.k===8||pr.k===9)
    punch(pr.x,gnd(pr.x,pr.f)-8,38+Math.sin(frame*0.3+pr.x)*4,0.85);
  for(const l of lights)punch(l.x,l.y,l.r,0.95);
  for(const z of zombies)if(z.fuseT>=0)punch(z.x,zMid(z),30,0.7);
  punch(extract.x,gnd(extract.x,extract.f)-14,extract.open?70:34,extract.open?0.9:0.5);
  ctx.drawImage(lc,0,0);
  /* warm glow on fires, teal on open extraction */
  function glow(wx,wy,r,col){
    const x=scrX(wx),y=scrY(wy),rr=r*cam.z;
    if(x<-rr||x>W+rr)return;
    const g=ctx.createRadialGradient(x,y,0,x,y,rr);
    g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(x-rr,y-rr,rr*2,rr*2);}
  for(const pr of props)if(pr.k===8||pr.k===9)
    glow(pr.x,gnd(pr.x,pr.f)-10,30,'rgba(255,140,60,'+(0.12+0.05*Math.sin(frame*0.35+pr.x))+')');
  if(extract.open&&state==='play')
    glow(extract.x,gnd(extract.x,extract.f)-16,44,'rgba(55,224,200,'+(0.18+0.08*Math.sin(frame*0.2))+')');
}
function bar(x,y,w,h,pct,fg,bg){

function campItems(){
  const it=CRAFTS.map(c=>({type:'craft',c,label:c.label}));
  it.push({type:'go',label:'BACK TO THE ROAD'});
  return it;}
function campPress(k){
  const items=campItems();
  if(k==='arrowup'||k==='w'||k==='up'){campSel=(campSel-1+items.length)%items.length;sfx('climb');return;}
  if(k==='arrowdown'||k==='s'||k==='down'){campSel=(campSel+1)%items.length;sfx('climb');return;}
  if(k!=='act'&&k!=='enter'&&k!==' '&&k!=='tap')return;
  const it=items[campSel];
  if(it.type==='go'){state='travel';sfx('buy');saveRun();return;}
  const c=it.c;
  if(c.k==='sell'){
    if(SV.sup.scrap<=0){sfx('deny');return;}
    const pay=SV.sup.scrap*6;SV.cash+=pay;SV.sup.scrap=0;
    sfx('cash');saveRun();return;}
  if(SV.sup.scrap<c.scrap){sfx('deny');return;}
  if(c.k==='ammo'){
    let low=null,lf=2;
    for(const k2 of WKEYS){
      if(!SV.owned[k2]||!AMMO_CAP[k2]||typeof (SV.ammo&&SV.ammo[k2])!=='number')continue;
      const f5=SV.ammo[k2]/AMMO_CAP[k2];if(f5<lf){lf=f5;low=k2;}}
    if(!low){sfx('deny');return;}
    ammoAdd(low,Math.round(AMMO_CAP[low]*0.30));}
  else if(c.k==='meds')SV.sup.meds++;
  else if(c.k==='fuel')SV.sup.fuel++;
  else SV.sup.food++;
  SV.sup.scrap-=c.scrap;sfx('clank');saveRun();}

    ctx.fillStyle=sel?'rgba(40,36,18,0.95)':'rgba(20,24,34,0.92)';
    ctx.beginPath();ctx.arc(nx,ny,12,0,7);ctx.fill();
    ctx.strokeStyle=locked?'#5a6472':(sel?'#ffd76a':rd.col);
    ctx.lineWidth=sel?2:1.2;
    ctx.beginPath();ctx.arc(nx,ny,12,0,7);ctx.stroke();
    ctx.save();if(locked)ctx.globalAlpha=0.45;
    mapGlyph(isDrive(r.tier)?'':biomeFor(r.tier).para,isDrive(r.tier),nx,ny-1);
    ctx.restore();
    if(locked){ctx.font='bold 8px monospace';ctx.textAlign='center';
      ctx.fillStyle='#8a939f';ctx.fillText('\u26fd',nx+8,ny-8);}
    ctx.textAlign='center';ctx.font=(sel?'bold ':'')+'7px monospace';
    ctx.fillStyle=sel?'#fff':'#8fa0b3';
    ctx.fillText('T'+r.tier+(r.mult!==1?' x'+r.mult:''),nx,ny+21);}
  /* story / overnight strip */
  if(eventResult||storyMsg){
    const isStory=!!storyMsg,cy2=mb+2,ch2=24;
    ctx.fillStyle=isStory?'#1a1722':'#171b24';ctx.fillRect(8,cy2,W-16,ch2);
    ctx.strokeStyle=isStory?'#3a3050':'#2a3040';ctx.lineWidth=1;
    ctx.strokeRect(8.5,cy2+.5,W-17,ch2-1);
    ctx.textAlign='left';ctx.font='bold 7px monospace';
    ctx.fillStyle=isStory?'#b8a8e8':'#8fa0b3';
    ctx.fillText(isStory?'\u25aa THE BROADCAST':'\u25c6 OVERNIGHT',14,cy2+9);
    ctx.font='8px monospace';
    ctx.fillStyle=isStory?'#cfc8e0':'#9aa8b8';
    const lines=wrapLines(isStory?storyMsg:eventResult,64);
    for(let k=0;k<Math.min(lines.length,2);k++)
      ctx.fillText(lines[k],14,cy2+(lines.length>1?15:17)+k*8);}
  /* ---- bottom: prep buttons + the chosen road ---- */
  const by=(eventResult||storyMsg)?mb+30:mb+6,bh=H-by-12;
  const btnDefs=[['shop','ARMORY'],['skill','SKILLS'],['loadout','GEAR'],['camp','CAMP']];
  for(let i=0;i<4;i++){
    const [ty2,lb]=btnDefs[i],
      row=items.findIndex(it=>it.type===ty2),
      bx=8+i*44,sel=travelSel===row;
    travelBtnZones.push({x:bx,y:by,w:40,h:bh,row});
    ctx.fillStyle=sel?'rgba(255,215,106,0.14)':'rgba(20,24,34,0.9)';
    ctx.fillRect(bx,by,40,bh-10);
    ctx.strokeStyle=sel?'#ffd76a':'rgba(70,80,96,0.5)';ctx.lineWidth=1;
    ctx.strokeRect(bx+.5,by+.5,39,bh-11);
    ctx.save();ctx.translate(bx+12,by+(bh-10)/2-8);uiIcon(ty2==='loadout'?'new':ty2,0,0);ctx.restore();
    ctx.textAlign='center';ctx.font='6px monospace';
    ctx.fillStyle=sel?'#ffd76a':'#8a939f';
    ctx.fillText(lb,bx+20,by+bh-14);
    /* badges */
    if(ty2==='skill'&&(SV.sp||0)>0){ctx.fillStyle='#7dffc8';ctx.font='bold 7px monospace';
      ctx.textAlign='right';ctx.fillText(SV.sp,bx+37,by+9);}
    if(ty2==='camp'&&SV.sup.scrap>0){ctx.fillStyle='#c8c8d8';ctx.font='bold 7px monospace';
      ctx.textAlign='right';ctx.fillText(SV.sup.scrap,bx+37,by+9);}}
  /* the chosen road card */
  {const cx0=186,cw=W-cx0-8;
   travelCardZone={x:cx0,y:by,w:cw,h:bh-10};
   ctx.fillStyle='rgba(20,24,34,0.9)';ctx.fillRect(cx0,by,cw,bh-10);
   ctx.strokeStyle='rgba(70,80,96,0.5)';ctx.strokeRect(cx0+.5,by+.5,cw-1,bh-11);
   if(selRoute>=0){
     const r=rs[selRoute],rd=readiness(r.tier),row=goRows[selRoute],
       locked=!!items[row].locked,
       nm=isDrive(r.tier)?'HIGHWAY RUN':biomeFor(r.tier).name;
     rowDecor('travel',row,cx0,by,cw,bh-10,false);
     ctx.textAlign='left';ctx.font='bold 9px monospace';
     ctx.fillStyle='#fff';ctx.fillText(nm.slice(0,20),cx0+7,by+11);
     ctx.font='7px monospace';ctx.fillStyle=rd.col;
     ctx.fillText(rd.label+' \u00b7 power '+playerPower()+' vs '+tierPower(r.tier)
       +(r.fuel?' \u00b7 \u26fd'+r.fuel:''),cx0+7,by+21);
     ctx.fillStyle=locked?'#ff8a7a':'#8fa0b3';
     const note=locked?'The truck needs '+r.fuel+' fuel. Scavenge or craft some.':r.note;
     const nl=wrapLines(note,26);
     for(let k=0;k<Math.min(nl.length,1);k++)ctx.fillText(nl[k],cx0+7,by+30+k*8);
     drawBtn('travel',cx0+6,by+bh-30,cw-12,17,
       locked?'OUT OF FUEL':'ROLL OUT \u25b6',!locked);}
   else{ctx.textAlign='center';ctx.font='8px monospace';ctx.fillStyle='#5a6472';
     ctx.fillText('TAP A PLACE ON THE MAP',cx0+cw/2,by+(bh-10)/2+3);}}
  ctx.textAlign='center';ctx.font='7px monospace';ctx.fillStyle='#5a6472';
  ctx.fillText('tap a place to look \u00b7 ROLL OUT when ready',W/2,H-4);
}
/* ---- pixel icons for the armory rows (drawn, not loaded — keeps it 1 file) ---- */
const SHOP_TOP=46,SHOP_STEP=21,SHOP_VISIBLE=6,ICON_W=16,ICON_H=13;
function ip(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w,h);}
function gunIcon(k,ox,oy){
  const c=(WEAPONS[k]||WEAPONS.pistol).color,dark='#3d4350',metal='#8b93a3';
  switch(k){
   case 'pistol':
    ip(ox+3,oy+4,8,3,c);ip(ox+11,oy+5,3,1,metal);
    ip(ox+4,oy+7,3,5,dark);ip(ox+9,oy+3,1,1,metal);break;
   case 'smg':
    ip(ox+3,oy+4,8,3,c);ip(ox+11,oy+5,4,1,metal);
    ip(ox+4,oy+7,2,3,dark);ip(ox+7,oy+7,2,5,dark);ip(ox+1,oy+4,2,2,dark);break;
   case 'shotgun':
    ip(ox+2,oy+4,13,2,c);ip(ox+5,oy+6,4,2,metal);
    ip(ox+0,oy+5,3,3,dark);ip(ox+9,oy+6,2,2,dark);break;
   case 'rifle':
    ip(ox+3,oy+4,9,2,c);ip(ox+12,oy+4,3,1,metal);
    ip(ox+0,oy+4,3,2,dark);ip(ox+6,oy+6,3,2,dark);ip(ox+7,oy+8,3,3,dark);
    ip(ox+3,oy+6,2,3,dark);break;
   case 'magnum':
    ip(ox+4,oy+4,7,3,c);ip(ox+11,oy+5,3,1,metal);
    ip(ox+6,oy+3,3,2,metal);ip(ox+5,oy+7,3,5,'#5a3a24');
    ip(ox+6,oy+5,2,2,dark);break;
   case 'xbow':
    ip(ox+2,oy+2,2,9,c);ip(ox+4,oy+1,1,2,c);ip(ox+4,oy+10,1,2,c);
    ip(ox+3,oy+6,12,1,'#6a7080');ip(ox+5,oy+5,7,3,dark);
    ip(ox+12,oy+6,4,1,'#e8e8b0');break;
   case 'flamer':
    ip(ox+2,oy+5,6,6,'#4a5560');ip(ox+3,oy+6,4,2,'#7a3a2a');
    ip(ox+8,oy+6,5,2,dark);ip(ox+13,oy+5,2,4,c);
    ip(ox+15,oy+6,1,2,'#ffe066');break;
   case 'gl':
    ip(ox+2,oy+5,10,4,dark);ip(ox+12,oy+4,4,6,c);
    ip(ox+4,oy+9,3,3,'#5a3a24');ip(ox+3,oy+3,5,2,metal);break;
   case 'minigun':
    ip(ox+1,oy+4,6,6,dark);ip(ox+7,oy+4,8,2,c);ip(ox+7,oy+7,8,2,c);
    ip(ox+7,oy+6,8,1,metal);ip(ox+2,oy+10,3,3,dark);break;
   default:
    ip(ox+2,oy+3,11,4,c);ip(ox+13,oy+4,2,1,metal);
    ip(ox+4,oy+7,5,4,dark);ip(ox+10,oy+7,1,4,metal);ip(ox+12,oy+7,1,4,metal);
    ip(ox+0,oy+4,2,2,dark);}}
function badge(kind,ox,oy){
  if(kind==='d'){ip(ox+13,oy+0,1,5,'#ff7a5a');ip(ox+12,oy+1,3,1,'#ff7a5a');
    ip(ox+11,oy+2,5,1,'#ffb35a');}
  else{ip(ox+14,oy+0,2,2,'#ffe066');ip(ox+12,oy+2,3,1,'#ffe066');
    ip(ox+13,oy+3,2,2,'#ffe066');}}
function shopIcon(it,ox,oy){
  switch(it.type){
    case 'med':
      ip(ox+2,oy+2,12,9,'#e8eef5');ip(ox+2,oy+2,12,1,'#b9c4d2');
      ip(ox+7,oy+4,2,5,'#d34141');ip(ox+5,oy+5,6,2,'#d34141');break;
    case 'item': itemIcon(it.k,ox,oy);break;
    case 'ammo':
      ip(ox+2,oy+5,12,7,'#5a5236');ip(ox+2,oy+5,12,2,'#6e6444');
      ip(ox+4,oy+2,2,4,'#c8b45a');ip(ox+7,oy+2,2,4,'#c8b45a');ip(ox+10,oy+2,2,4,'#c8b45a');
      break;
    case 'buy': gunIcon(it.k,ox,oy);break;
    case 'd': gunIcon(it.k,ox,oy);badge('d',ox,oy);break;
    case 'r': gunIcon(it.k,ox,oy);badge('r',ox,oy);break;
    case 'hp':
      ip(ox+4,oy+3,3,2,'#ff5a7a');ip(ox+9,oy+3,3,2,'#ff5a7a');
      ip(ox+3,oy+5,10,2,'#ff5a7a');ip(ox+4,oy+7,8,1,'#ff5a7a');
      ip(ox+5,oy+8,6,1,'#ff5a7a');ip(ox+7,oy+9,2,1,'#ff5a7a');
      ip(ox+5,oy+4,2,1,'#ffa8bc');break;
    case 'go':
      ip(ox+7,oy+6,7,2,'#7dffc8');
      for(let i=0;i<4;i++)ip(ox+3+i,oy+6-i,1,2+i*2,'#7dffc8');break;
    default: uiIcon(it.type,ox,oy);}}
const TRAVEL_TOP=140,TRAVEL_STEP=18;
let travelRowTop=TRAVEL_TOP,travelRowStep=TRAVEL_STEP;
function wrapLines(txt,maxChars){
  const words=txt.split(' '),out=[];let line='';
  for(const w of words){
    if((line+' '+w).trim().length>maxChars){out.push(line.trim());line=w;}
    else line=(line+' '+w).trim();}
  if(line)out.push(line);return out;}
const SHOP_COLS=6,SHOP_ROWS=2,SHOP_TW=52,SHOP_TH=42,
  SHOP_GX=26,SHOP_GY=36,SHOP_PER=SHOP_COLS*SHOP_ROWS;
function gridShopItems(){return shopItems().filter(it=>it.type!=='go');}
function shopBadge(it){
  if(it.type==='ammo')return SV.ammo[it.k]>=AMMO_CAP[it.k]?'FULL':SV.ammo[it.k];
  if(it.type==='item')return 'x'+SV.items[it.k];
  if(it.type==='d')return 'Lv'+SV.up[it.k].d;
  if(it.type==='r')return 'Lv'+SV.up[it.k].r;
  if(it.type==='hp')return 'Lv'+SV.hpLvl;
  if(it.type==='med')return Math.ceil(SV.hp)+'/'+SV.maxHp;
  return '';}
function shopDesc(it){
  if(it.type==='buy')return 'DMG '+WEAPONS[it.k].dmg+' \u00b7 ROF '
    +WEAPONS[it.k].rof+(WEAPONS[it.k].pellets>1?' \u00b7 x'+WEAPONS[it.k].pellets+' shot':'')
    +(AMMO_CAP[it.k]?' \u00b7 '+AMMO_CAP[it.k]+' rounds':' \u00b7 no ammo needed');
  if(it.type==='ammo')return '+'+AMMO_BUY[it.k][0]+' rounds \u00b7 have '
    +SV.ammo[it.k]+'/'+AMMO_CAP[it.k];
  if(it.type==='d')return 'Damage +25% \u00b7 now '+wDmg(it.k).toFixed(1);
  if(it.type==='r')return 'Fire rate +14% \u00b7 now '+wRof(it.k).toFixed(1)+'/s';
  if(it.type==='item')return ITEMS[it.k].desc||'Carry up to '+itemMax(it.k);
  if(it.type==='med')return 'Patches +50 HP on the spot';
  if(it.type==='hp')return 'Max health +25, healed to full';
  return '';}
function drawShop(){
  ctx.fillStyle='#12151f';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1c2130';ctx.fillRect(0,0,W,30);
  ctx.fillStyle='#2a3346';ctx.fillRect(0,29,W,1);
  /* back button */
  ctx.fillStyle='rgba(125,255,200,0.10)';ctx.fillRect(4,4,24,22);
  ctx.strokeStyle='rgba(125,255,200,0.45)';ctx.strokeRect(4.5,4.5,23,21);
  ctx.textAlign='center';ctx.font='bold 13px monospace';
  ctx.fillStyle='#7dffc8';ctx.fillText('\u2039',16,19);
  ctx.textAlign='left';ctx.font='bold 13px monospace';
  ctx.fillStyle='#ffd76a';ctx.fillText('ARMORY',34,20);
  ctx.textAlign='right';ctx.fillStyle='#9fff9f';ctx.fillText('$'+SV.cash,W-8,20);
  const items=gridShopItems();
  if(shopSel>=items.length)shopSel=items.length-1;
  const pages=Math.max(1,Math.ceil(items.length/SHOP_PER)),
    page=Math.floor(shopSel/SHOP_PER);
  /* paging arrows */
  const drawArrow=(x,dir,on)=>{
    ctx.fillStyle=on?'rgba(255,215,106,0.12)':'rgba(90,100,116,0.08)';
    ctx.fillRect(x,SHOP_GY,20,SHOP_ROWS*SHOP_TH);
    ctx.textAlign='center';ctx.font='bold 14px monospace';
    ctx.fillStyle=on?'#ffd76a':'#3d4450';
    ctx.fillText(dir,x+10,SHOP_GY+SHOP_ROWS*SHOP_TH/2+5);};
  drawArrow(3,'\u2039',page>0);
  drawArrow(W-23,'\u203a',page<pages-1);
  /* tiles */
  for(let t=0;t<SHOP_PER;t++){
    const idx=page*SHOP_PER+t;
    if(idx>=items.length)break;
    const it=items[idx],
      col=t%SHOP_COLS,row=(t/SHOP_COLS)|0,
      x=SHOP_GX+col*SHOP_TW,y=SHOP_GY+row*SHOP_TH,
      sel=idx===shopSel,afford=SV.cash>=it.cost;
    ctx.fillStyle=sel?'rgba(40,36,18,0.95)':'rgba(18,22,32,0.85)';
    ctx.fillRect(x+1,y+1,SHOP_TW-2,SHOP_TH-2);
    ctx.strokeStyle=sel?'#ffd76a':'rgba(70,80,96,0.5)';
    ctx.lineWidth=sel?1.5:1;
    ctx.strokeRect(x+1.5,y+1.5,SHOP_TW-3,SHOP_TH-3);
    ctx.save();
    if(!afford&&it.cost>0)ctx.globalAlpha=0.42;
    ctx.translate(x+SHOP_TW/2-10,y+5);ctx.scale(1.25,1.25);
    shopIcon(it,0,0);ctx.restore();
    /* price line */
    ctx.textAlign='center';ctx.font='bold 7px monospace';
    ctx.fillStyle=it.cost>0?(afford?'#9fff9f':'#ff8a7a'):'#7dffc8';
    ctx.fillText(it.cost>0?'$'+it.cost:'',x+SHOP_TW/2,y+SHOP_TH-4);
    /* corner badge */
    const bg=shopBadge(it);
    if(bg!==''){ctx.textAlign='right';ctx.font='6px monospace';
      ctx.fillStyle='#8fa0b3';ctx.fillText(bg,x+SHOP_TW-3,y+9);}
    /* type stripe: guns gold, ammo brass, items blue, upgrades green */
    ctx.fillStyle=it.type==='buy'?'#ffd76a':(it.type==='ammo'?'#c8b45a'
      :(it.type==='item'?'#8ac8ff':(it.type==='med'?'#ff8a8a':'#7dffc8')));
    ctx.fillRect(x+1,y+1,3,3);}
  /* page dots */
  ctx.textAlign='center';
  for(let p2=0;p2<pages;p2++){
    ctx.fillStyle=p2===page?'#ffd76a':'rgba(120,132,150,0.35)';
    ctx.beginPath();ctx.arc(W/2+(p2-(pages-1)/2)*10,SHOP_GY+SHOP_ROWS*SHOP_TH+7,2,0,7);ctx.fill();}
  /* ---- detail panel ---- */
  const it=items[shopSel];
  const py2=SHOP_GY+SHOP_ROWS*SHOP_TH+13,ph2=H-py2-16;
  ctx.fillStyle='#171b26';ctx.fillRect(6,py2,W-12,ph2);
  ctx.strokeStyle='#2a3346';ctx.lineWidth=1;ctx.strokeRect(6.5,py2+.5,W-13,ph2-1);
  rowDecor('shop',shopSel,6,py2,W-12,ph2,false);
  ctx.save();ctx.translate(16,py2+ph2/2-9);ctx.scale(1.7,1.7);shopIcon(it,0,0);ctx.restore();
  ctx.textAlign='left';ctx.font='bold 10px monospace';
  ctx.fillStyle='#fff';
  const nm2=it.type==='buy'?WEAPONS[it.k].name
    :(it.type==='ammo'?WEAPONS[it.k].name+' AMMO'
    :(it.type==='d'||it.type==='r'?WEAPONS[it.k].name+(it.type==='d'?' \u2014 DAMAGE':' \u2014 RATE')
    :(it.type==='item'?ITEMS[it.k].name
    :(it.type==='med'?'FIELD MEDKIT':'TOUGHER HIDE'))));
  ctx.fillText(nm2,52,py2+13);
  ctx.font='8px monospace';ctx.fillStyle='#8fa0b3';
  ctx.fillText(shopDesc(it).slice(0,34),52,py2+25);
  const afford2=SV.cash>=it.cost,
    full=(it.type==='ammo'&&SV.ammo[it.k]>=AMMO_CAP[it.k])
      ||(it.type==='item'&&SV.items[it.k]>=itemMax(it.k))
      ||(it.type==='med'&&SV.hp>=SV.maxHp);
  drawBtn('shop',W-104,py2+ph2/2-9,92,18,
    full?(it.type==='med'?'FULL HP':'FULL'):'BUY \u00b7 $'+it.cost,
    afford2&&!full);
  ctx.textAlign='center';ctx.font='8px monospace';ctx.fillStyle='#5a6472';
  ctx.fillText('tap an item to look it over \u00b7 \u2039 back to the road',W/2,H-6);
}
</script>
